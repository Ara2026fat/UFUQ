<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ورقة اعتماد — أُفق قدرات</title><meta name="robots" content="noindex">
<style>
:root{--bg:#F6F8FC;--card:#fff;--ink:#16202F;--soft:#55667E;--line:rgba(20,40,70,.14);
--blue:#2F6FB5;--ok:#1E8A52;--warn:#9A6B10;--bad:#C0392B}
@media(prefers-color-scheme:dark){:root{--bg:#0B1220;--card:#131D30;--ink:#E8EEF8;--soft:#A9B8CE;
--line:rgba(170,195,230,.17);--blue:#7FA8D9;--ok:#6FCF97;--warn:#E8B964;--bad:#FF8A7A}}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);
font:400 16.5px/1.85 "SF Arabic","Noto Naskh Arabic",system-ui,sans-serif;
display:flex;flex-direction:column;
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#gate{margin:auto;max-width:360px;width:88%;text-align:center}
#gate h1{font-size:25px;margin:0 0 7px;font-weight:650}
#gate p{color:var(--soft);margin:0 0 18px;font-size:15.5px}
#pw{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;
border:1px solid var(--line);background:var(--card);color:var(--ink);text-align:center}
#go{width:100%;margin-top:10px;font:inherit;font-weight:700;font-size:17px;padding:12px;
border:0;border-radius:12px;background:var(--blue);color:#07121F;cursor:pointer}
#err{color:var(--bad);font-size:14.5px;min-height:1.4em;margin-top:9px}
#app{display:none;flex:1;min-height:0;flex-direction:column}
#top{display:flex;align-items:center;gap:10px;padding:11px 15px;border-bottom:1px solid var(--line);
font-size:14px;color:var(--soft);flex:0 0 auto}
#top b{color:var(--ink);font-weight:620;font-size:15.5px}
#prog{margin-inline-start:auto;font-variant-numeric:tabular-nums}
#bar{height:3px;background:var(--line);flex:0 0 auto}
#bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .2s}
#mid{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 15px;-webkit-overflow-scrolling:touch}
.dd{font-size:12.5px;color:var(--soft);border:1px solid var(--line);border-radius:7px;padding:1px 7px}
.stem{font-weight:600;margin:0 0 12px;font-size:17.5px;line-height:1.8}
.psg{margin:0 0 11px;font-size:15px;background:var(--card);border:1px solid var(--line);
border-radius:12px;padding:10px 13px}
.psg summary{cursor:pointer;color:var(--blue);font-weight:600}
.psg p{margin:7px 0;color:var(--soft);line-height:1.8}
.fig{margin:0 0 11px}.fig svg{max-width:100%;height:auto}
.opts{list-style:none;margin:0 0 11px;padding:0}
.opts li{padding:8px 11px;border:1px solid var(--line);border-radius:11px;margin-bottom:7px;font-size:15.5px}
.opts li.k{border-color:var(--ok)}
.opts li.k b{color:var(--ok)}.opts li.k b::after{content:" ✔"}
.opts i{display:block;color:var(--soft);font-size:14.2px;font-style:normal;line-height:1.7;margin-top:3px}
.sol{font-size:15px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 13px}
.sol summary{cursor:pointer;color:var(--blue);font-weight:600}
.sol ol{margin:8px 0 0;padding-right:19px;color:var(--soft);line-height:1.8}
#bot{flex:0 0 auto;border-top:1px solid var(--line);padding:10px 15px 12px;background:var(--card)}
#vote{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}
#vote button{font:inherit;font-size:14.5px;padding:9px 6px;border-radius:11px;
border:1px solid var(--line);background:transparent;color:var(--soft);cursor:pointer}
#vote button[data-v=ok].on{background:var(--ok);border-color:var(--ok);color:#06140C}
#vote button[data-v=easy].on,#vote button[data-v=hard].on{background:var(--warn);border-color:var(--warn);color:#1A1203}
#vote button[data-v=bad].on{background:var(--bad);border-color:var(--bad);color:#fff}
#cmt{width:100%;font:inherit;font-size:14.5px;padding:8px 11px;border-radius:10px;
border:1px solid var(--line);background:var(--bg);color:var(--ink);display:none;margin-bottom:8px}
#cmt.show{display:block}
#nav{display:flex;gap:8px}
#nav button{flex:1;font:inherit;font-size:16px;font-weight:650;padding:11px;border-radius:12px;
border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
#nav #next{background:var(--blue);border-color:var(--blue);color:#07121F}
#nav button:disabled{opacity:.35}
.end{text-align:center;padding:10px 0}
.end h2{font-size:21px;margin:0 0 8px;font-weight:650}
.end p{color:var(--soft);margin:0 0 14px}
.skv{display:grid;gap:8px;max-width:340px;margin:0 auto}
.skv button{font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);
background:transparent;color:var(--ink);cursor:pointer}
.skv button[data-sv=approve].on{background:var(--ok);border-color:var(--ok);color:#06140C}
.skv button[data-sv=redo].on{background:var(--warn);border-color:var(--warn);color:#1A1203}
#out{width:100%;height:34vh;font:13px/1.7 ui-monospace,monospace;direction:ltr;text-align:left;
margin-top:10px;padding:10px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.hint{color:var(--soft);font-size:13.5px;text-align:center;margin-top:7px}
</style></head><body>

<div id="gate">
  <h1>ورقة اعتماد — أُفق قدرات</h1>
  <p>أستاذ إبراهيم، اكتب الكلمة التي أرسلها لك عرفات.</p>
  <input id="pw" type="password" inputmode="latin" autocomplete="off" placeholder="الكلمة">
  <button id="go">ادخل</button>
  <div id="err"></div>
</div>

<div id="app">
  <div id="top"><b id="skn"></b><span class="dd" id="dd"></span><span id="prog"></span></div>
  <div id="bar"><i id="barf"></i></div>
  <div id="mid"></div>
  <div id="bot">
    <div id="vote">
      <button data-v="ok">سليم</button><button data-v="bad">فيه خطأ</button>
      <button data-v="easy">أسهل مما صُنِّف</button><button data-v="hard">أصعب مما صُنِّف</button>
    </div>
    <textarea id="cmt" rows="2" placeholder="ملاحظتك (اختياري)"></textarea>
    <div id="nav"><button id="prev">السابق</button><button id="next">التالي</button></div>
  </div>
</div>

const d64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const E=id=>document.getElementById(id);
let Q=[],i=0,V={};const K='ufuq-review-v2';
try{V=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}

async function unlock(){
  const pw=E('pw').value.trim(); if(!pw)return;
  E('err').textContent='جارٍ الفتح…'; E('go').disabled=true;
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d64(SALT),iterations:250000,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d64(NONCE)},k,d64(BLOB));
    Q=JSON.parse(new TextDecoder().decode(pt));
    try{sessionStorage.setItem('ufuq-pw',pw)}catch(e){}
    E('gate').style.display='none'; E('app').style.display='flex';
    const last=parseInt(localStorage.getItem(K+':at')||'0',10);
    i=(last>0&&last<Q.length)?last:0; draw();
  }catch(e){ E('err').textContent='الكلمة غير صحيحة.'; E('go').disabled=false; }
}
E('go').onclick=unlock;
E('pw').onkeydown=e=>{if(e.key==='Enter')unlock()};

const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const LBL={ok:'سليم',easy:'أسهل',hard:'أصعب',bad:'خطأ',approve:'اعتُمدت',redo:'أعيدوا النظر'};

function draw(){
  try{localStorage.setItem(K+':at',i)}catch(e){}
  const mid=E('mid'); mid.scrollTop=0;
  if(i>=Q.length){ drawEnd(); return; }
  const q=Q[i], last=(i+1>=Q.length)||Q[i+1].sk!==q.sk;
  E('skn').textContent=q.skn; E('dd').textContent='درجة '+q.d;
  E('prog').textContent=q.n+' من 20';
  E('barf').style.width=((i+1)/Q.length*100)+'%';
  let h='';
  if(q.psg) h+='<details class="psg"><summary>القطعة: '+esc(q.psg.title)+'</summary>'+
    q.psg.paras.map(p=>'<p>'+esc(p)+'</p>').join('')+'</details>';
  h+='<div class="stem">'+esc(q.stem)+'</div>';
  if(q.fig) h+='<div class="fig">'+q.fig+'</div>';
  h+='<ul class="opts">'+q.opts.map((o,j)=>'<li class="'+(j===q.ans?'k':'')+'"><b>'+esc(o)+'</b>'+
    (q.traps[j]?'<i>'+esc(q.traps[j])+'</i>':'')+'</li>').join('')+'</ul>';
  if(q.sol.length) h+='<details class="sol"><summary>الشرح</summary><ol>'+
    q.sol.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol></details>';
  mid.innerHTML=h;
  E('bot').style.display='';
  const v=V[q.id];
  // و!! لازمةٌ: v غيرُ معرّفٍ يُعطي undefined، وtoggle بـundefined
  // يَقلِب الصِّنفَ بدلَ أن يُطفِئه — فتُضيءُ الأزرارُ الأربعةُ معًا.
  document.querySelectorAll('#vote button').forEach(b=>b.classList.toggle('on',!!(v&&v.v===b.dataset.v)));
  const c=E('cmt'); c.value=(v&&v.c)||''; c.classList.toggle('show',!!(v&&v.v&&v.v!=='ok'));
  E('prev').disabled=(i===0);
  E('next').textContent=last?'حكمك على المهارة ←':'التالي';
}
function drawEnd(){
  E('bot').style.display='none';
  let t='حكم الأستاذ إبراهيم — ورقة اعتماد أُفق قدرات\n';
  const skl=[...new Set(Q.map(q=>q.sk))];
  skl.forEach(sk=>{const L=Q.filter(q=>q.sk===sk), sv=V['SK:'+sk];
    t+='\n== '+L[0].skn+(sv?' :: '+LBL[sv]:' :: (بلا حكم)')+'\n';
    L.forEach(q=>{const v=V[q.id]; if(!v||!v.v)return;
      if(v.v!=='ok'||v.c)t+='  - '+q.id+' ['+LBL[v.v]+']'+(v.c?' : '+v.c:'')+'\n';});
    t+='  سليم: '+L.filter(q=>V[q.id]&&V[q.id].v==='ok').length+' من '+L.length+'\n';});
  E('mid').innerHTML='<div class="end"><h2>انتهت الورقة</h2>'+
    '<p>انسخ النص وأرسله لعرفات.</p>'+
    '<div class="skv"><button id="cp">نسخ النتيجة</button>'+
    '<button id="back">رجوع للأسئلة</button></div>'+
    '<textarea id="out" readonly></textarea></div>';
  E('out').value=t;
  E('cp').onclick=()=>{const o=E('out');o.select();
    try{document.execCommand('copy');E('cp').textContent='نُسخت ✔'}catch(e){}};
  E('back').onclick=()=>{i=Q.length-1;draw()};
}
function drawSkillVote(sk,skn){
  E('bot').style.display='none';
  E('mid').innerHTML='<div class="end"><h2>'+esc(skn)+'</h2>'+
    '<p>حكمتَ على عشرين سؤالًا من هذه المهارة. ما حكمك عليها كلها؟</p>'+
    '<div class="skv"><button data-sv="approve">أعتمد المهارة</button>'+
    '<button data-sv="redo">أعيدوا النظر فيها</button>'+
    '<button id="skn-next" style="margin-top:6px">المهارة التالية ←</button></div>'+
    '<div class="hint">تقدر ترجع بالسابق إن أردت مراجعة سؤال.</div></div>';
  const paint=()=>document.querySelectorAll('.skv button[data-sv]').forEach(b=>
    b.classList.toggle('on',V['SK:'+sk]===b.dataset.sv));
  document.querySelectorAll('.skv button[data-sv]').forEach(b=>b.onclick=()=>{
    V['SK:'+sk]=(V['SK:'+sk]===b.dataset.sv)?'':b.dataset.sv; save(); paint();});
  paint();
  // وi تَقدَّمَ أصلًا عندَ عَرضِ شاشةِ الحُكم، فزيادتُه هنا
  // تَقفِز فوقَ السؤالِ الأوّلِ من المهارةِ التالية.
  E('skn-next').onclick=()=>{draw()};
}
function save(){try{localStorage.setItem(K,JSON.stringify(V))}catch(e){}}
document.querySelectorAll('#vote button').forEach(b=>b.onclick=()=>{
  const q=Q[i]; V[q.id]={v:b.dataset.v,c:(V[q.id]&&V[q.id].c)||'',sk:q.sk}; save();
  document.querySelectorAll('#vote button').forEach(x=>x.classList.toggle('on',x===b));
  E('cmt').classList.toggle('show',b.dataset.v!=='ok');});
E('cmt').oninput=()=>{const q=Q[i];V[q.id]=V[q.id]||{v:'',sk:q.sk};V[q.id].c=E('cmt').value;save()};
E('prev').onclick=()=>{if(i>0){i--;draw()}};
E('next').onclick=()=>{
  const q=Q[i], last=(i+1>=Q.length)||Q[i+1].sk!==q.sk;
  if(last){ drawSkillVote(q.sk,q.skn); i++; return; }
  i++; draw();};
try{const p=sessionStorage.getItem('ufuq-pw'); if(p){E('pw').value=p;unlock()}}catch(e){}
</script></body></html>
