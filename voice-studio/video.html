<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أفق — صوت فيديو الشرح</title>
<style>body{font-family:Tahoma,system-ui,sans-serif;background:#f6f1e4;color:#14234A;margin:0;padding:14px;max-width:760px;margin-inline:auto;line-height:1.8}
.c{background:#fff;border:1.5px solid #e3d3a3;border-radius:16px;padding:14px;margin:12px 0}input,select,textarea{font:inherit;width:100%;padding:9px;border:1.5px solid #d9cfae;border-radius:10px;margin:4px 0}
textarea{font-size:1.2rem;font-family:'Amiri','Traditional Arabic',serif;min-height:90px}button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 16px;background:#1F63D6;color:#fff;cursor:pointer;margin:3px}button.s{background:#fff;color:#143F9E;border:1.5px solid #1F63D6}button:disabled{opacity:.45}
.ok{color:#2e9d62;font-weight:700}.err{color:#c0392b;font-weight:700}h1{font-size:1.3rem;margin:0}</style></head><body>
<h1>أفق — صوت فيديو الشرح</h1><small>eleven_v3 · الثبات ١٫٠ · التشابه ٠٫٨ · المفتاح لا يُحفظ</small>
<div class="c"><input id="key" type="password" placeholder="مفتاح ElevenLabs (sk_…)" style="direction:ltr"><select id="voice"><option value="">اضغط «حمّل أصواتي» ثم اختر «مرشد أفق»</option></select>
<button id="mine" class="s">حمّل أصواتي</button> <button id="all">ولّد كل المقاطع</button> <button id="zip" class="s" disabled>حمّل الكل (ZIP)</button> <span id="m"></span></div>
<div id="L"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const LINES=[["v01", "أَهْلًا بِكَ فِي «أُفُق»، مِنَصَّتِكَ لِإِتْقَانِ القُدُرَاتِ الكَمِّيِّ وَاللَّفْظِيِّ. أَنَا مُرْشِدُكَ، وَسَأُرِيكَ فِي دَقِيقَةٍ كُلَّ مَا تَحْتَاجُهُ."], ["v02", "أَوَّلُ شَيْءٍ: الكَمِّيُّ وَاللَّفْظِيُّ، تَنْتَقِلُ بَيْنَهُمَا بِلَمْسَةٍ وَاحِدَةٍ فِي أَعْلَى الشَّاشَةِ."], ["v03", "مِنْ أَسْفَلِ الشَّاشَةِ تَجِدُ كُلَّ شَيْءٍ. اِضْغَطْ «أَتَعَلَّمُ» لِتَرَى دُرُوسَكَ مُرَتَّبَةً خُطْوَةً بِخُطْوَةٍ."], ["v04", "وَهُنَا دُرُوسُ الأُسْتَاذِ المُصَوَّرَةُ، يَشْرَحُ لَكَ فِيهَا الفِكْرَةَ بِبَسَاطَةٍ حَتَّى تَفْهَمَ وَلَا تَحْفَظَ."], ["v05", "وَدَاخِلَ كُلِّ وَحْدَةٍ: الفِكْرَةُ، ثُمَّ القَاعِدَةُ، ثُمَّ مِثَالٌ، ثُمَّ تَدْرِيبٌ لِتَتَأَكَّدَ مِنْ فَهْمِكَ."], ["v06", "وَمِنْ «أَتَدَرَّبُ» تَحُلُّ أَسْئِلَةً عَلَى مُسْتَوَاكَ، وَتَعْرِفُ جَوَابَكَ فَوْرًا."], ["v07", "وَإِنْ أَخْطَأْتَ فَلَا تَقْلَقْ، سَنُرِيكَ مَوْضِعَ الخَطَأِ وَنَشْرَحُهُ بِطَرِيقَةٍ أَبْسَطَ."], ["v08", "وَإِذَا أَرَدْتَ أَنْ تُجَرِّبَ أَجْوَاءَ الِاخْتِبَارِ الحَقِيقِيِّ، فَاخْتَرْ «أَخْتَبِرُ» لِاخْتِبَارِ مُحَاكَاةٍ بِالوَقْتِ المُحَدَّدِ."], ["v09", "وَأَخْطَاؤُكَ تَجْتَمِعُ فِي «دَفْتَرِ أَخْطَائِي»، تُعِيدُ المُحَاوَلَةَ فِيهَا كُلَّمَا شِئْتَ."], ["v10", "وَفِي «جَدْوَلِي» تَضَعُ خُطَّتَكَ الأُسْبُوعِيَّةَ بِمَا يُنَاسِبُ وَقْتَكَ."], ["v11", "هَذِهِ هِيَ رِحْلَتُكَ فِي «أُفُق». اِبْدَأْ اليَوْمَ، وَأَنَا مَعَكَ فِي كُلِّ خُطْوَةٍ."]];const $=s=>document.querySelector(s);const B={};
LINES.forEach(([id,t],i)=>{const d=document.createElement('div');d.className='c';d.innerHTML=`<b>${i+1}</b> <span id="s${id}"></span><textarea id="t${id}">${t}</textarea><button data-g="${id}">ولّد</button><button class="s" data-p="${id}" disabled>استمع</button>`;$('#L').append(d)});
async function gen(id){const k=$('#key').value.trim(),v=$('#voice').value;if(!k||!v){$('#m').textContent='الصق المفتاح واختر الصوت';throw 0}
$('#s'+id).textContent='...';const r=await fetch('https://api.elevenlabs.io/v1/text-to-speech/'+v+'?output_format=mp3_44100_128',{method:'POST',headers:{'xi-api-key':k,'Content-Type':'application/json'},body:JSON.stringify({text:$('#t'+id).value,model_id:'eleven_v3',voice_settings:{stability:1,similarity_boost:0.8,style:0,use_speaker_boost:true}})});
if(!r.ok){$('#s'+id).innerHTML='<span class=err>خطأ '+r.status+'</span>';throw 0}B[id]=await r.blob();$('#s'+id).innerHTML='<span class=ok>جاهز</span>';document.querySelector('[data-p="'+id+'"]').disabled=false;$('#zip').disabled=false}
document.addEventListener('click',async e=>{const g=e.target.dataset.g,p=e.target.dataset.p;if(g)try{await gen(g)}catch{}if(p)new Audio(URL.createObjectURL(B[p])).play()});
$('#all').onclick=async()=>{for(const[l]of LINES){try{await gen(l)}catch{break}}};
$('#mine').onclick=async()=>{try{const r=await fetch('https://api.elevenlabs.io/v1/voices',{headers:{'xi-api-key':$('#key').value.trim()}});const j=await r.json();const s=$('#voice');s.innerHTML='';j.voices.forEach(v=>{const o=document.createElement('option');o.value=v.voice_id;o.textContent=v.name;s.append(o)});const m=j.voices.find(v=>v.name.includes('مرشد'));if(m)s.value=m.voice_id;$('#m').textContent=j.voices.length+' صوت'}catch{$('#m').textContent='خطأ'}};
$('#zip').onclick=async()=>{const z=new JSZip();for(const k in B)z.file(k+'.mp3',B[k]);const u=URL.createObjectURL(await z.generateAsync({type:'blob'}));const a=document.createElement('a');a.href=u;a.download='ufuq-video-voice.zip';a.click()};
</script></body></html>
