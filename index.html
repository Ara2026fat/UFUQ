  --glass:linear-gradient(158deg,rgba(255,255,255,.96),rgba(255,255,255,.72)); --glass-line:rgba(0,0,0,.075); --glass-shadow:0 14px 34px rgba(60,60,80,.10); --edge:rgba(255,255,255,.9);
  --flat:rgba(255,255,255,.62); --flat-line:rgba(0,0,0,.065); --line:rgba(0,0,0,.07); --tab-bg:#FFFFFF; --solid:#FFFFFF;
  --grow:#3B7566; --grow-tint:rgba(59,117,102,.13);
  --near:#8C6A22; --near-tint:rgba(140,106,34,.13);
  --glow:#4F55A0; --glow-tint:rgba(79,85,160,.13);
  --btn-bg:rgba(79,85,160,.13);
  --btn-line:rgba(79,85,160,.42); --btn-ink:#3B4090;
  --paper:var(--flat); --sky:var(--void);
}
[data-theme="sand"]{
  --void:#F2EBDF; --lift1:#FFFAF1; --lift2:#E7DDCB;
  --ink:#262019; --ink-soft:#6A5F51; --ink-faint:#978B79;
  --glass:linear-gradient(158deg,rgba(255,255,255,.96),rgba(255,255,255,.72)); --glass-line:rgba(0,0,0,.075); --glass-shadow:0 14px 34px rgba(60,60,80,.10); --edge:rgba(255,255,255,.9);
  --flat:rgba(255,255,255,.62); --flat-line:rgba(0,0,0,.065); --line:rgba(0,0,0,.07); --tab-bg:#FFFAF1; --solid:#FFFFFF;
  --grow:#457458; --grow-tint:rgba(69,116,88,.13);
  --near:#8A6821; --near-tint:rgba(138,104,33,.13);
  --glow:#7E5F33; --glow-tint:rgba(126,95,51,.13);
  --btn-bg:rgba(126,95,51,.13);
  --btn-line:rgba(126,95,51,.42); --btn-ink:#6B4E26;
  --paper:var(--flat); --sky:var(--void);
}
[data-theme="mint"]{
  --void:#EDF4F0; --lift1:#FFFFFF; --lift2:#E0EBE5;
  --ink:#16221D; --ink-soft:#566661; --ink-faint:#869691;
  --glass:linear-gradient(158deg,rgba(255,255,255,.96),rgba(255,255,255,.72)); --glass-line:rgba(0,0,0,.075); --glass-shadow:0 14px 34px rgba(60,60,80,.10); --edge:rgba(255,255,255,.9);
  --flat:rgba(255,255,255,.62); --flat-line:rgba(0,0,0,.065); --line:rgba(0,0,0,.07); --tab-bg:#FFFFFF; --solid:#FFFFFF;
  --grow:#2E6E61; --grow-tint:rgba(46,110,97,.13);
  --near:#8A6A24; --near-tint:rgba(138,106,36,.13);
  --glow:#2E6E61; --glow-tint:rgba(46,110,97,.13);
  --btn-bg:rgba(46,110,97,.13);
  --btn-line:rgba(46,110,97,.42); --btn-ink:#255C51;
  --paper:var(--flat); --sky:var(--void);
}
[data-theme="grey"]{
  --void:#EEF0F3; --lift1:#FFFFFF; --lift2:#E1E6EC;
  --ink:#1B1F26; --ink-soft:#5A6270; --ink-faint:#8B93A1;
  --glass:linear-gradient(158deg,rgba(255,255,255,.96),rgba(255,255,255,.72)); --glass-line:rgba(0,0,0,.075); --glass-shadow:0 14px 34px rgba(60,60,80,.10); --edge:rgba(255,255,255,.9);
  --flat:rgba(255,255,255,.62); --flat-line:rgba(0,0,0,.065); --line:rgba(0,0,0,.07); --tab-bg:#FFFFFF; --solid:#FFFFFF;
  --grow:#3B7566; --grow-tint:rgba(59,117,102,.13);
  --near:#816723; --near-tint:rgba(129,103,35,.13);
  --glow:#465379; --glow-tint:rgba(70,83,121,.13);
  --btn-bg:rgba(70,83,121,.13);
  --btn-line:rgba(70,83,121,.42); --btn-ink:#3A456B;
  --paper:var(--flat); --sky:var(--void);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  margin:0;padding:0;
  background:var(--void);
  font-family:var(--body);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
/* الجوال: الجسم مثبّت على المنفذ المرئي تمامًا — لا vh ولا svh ولا تمرير للصفحة */
@media(max-width:519px){
  html{overflow:hidden}
  body{position:fixed;inset:0;overflow:hidden;display:block}
}
/* سطح المكتب: بطاقة متوسّطة */
@media(min-width:520px){
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:28px 0;background:var(--void);filter:none}
}

#shell{
  width:100%;max-width:430px;
  height:100%;
  margin:0 auto;
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  /* تدرّج واحد ثابت — لا حركة، لا تباين حاد */
  background:
    radial-gradient(120% 78% at 78% -8%, var(--lift1) 0%, transparent 58%),
    radial-gradient(96% 62% at 8% 104%, var(--lift2) 0%, transparent 62%),
    var(--void);
  color:var(--ink);
}
@media(min-width:520px){
  #shell{height:860px;max-height:92vh;border-radius:36px;
    box-shadow:0 30px 80px rgba(0,0,0,.62),0 0 0 1px rgba(255,255,255,.05)}
}
#app{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  padding:env(safe-area-inset-top,0) var(--pad) 26px}
#app::-webkit-scrollbar{width:0}
#app>.fade{min-height:100%;display:flex;flex-direction:column}

/* ───── الطباعة ───── */
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;letter-spacing:-.005em}
h1{font-size:26px;line-height:1.5}
h2{font-size:20px;line-height:1.5}
h3{font-size:16px;font-weight:500}
p{margin:0;line-height:1.8;font-size:15px}
.eyebrow{font-size:11.5px;letter-spacing:.15em;color:var(--ink-faint);
  font-weight:500;margin-bottom:10px}
.soft{color:var(--ink-soft)}
.faint{color:var(--ink-faint);font-size:13px;line-height:1.75}
.num{font-variant-numeric:tabular-nums}

/* ───── التخطيط ───── */
.top{padding:26px 0 14px;display:flex;align-items:center;justify-content:space-between;min-height:64px}
.back{background:none;border:0;font:inherit;font-size:14px;color:var(--ink-faint);
  cursor:pointer;padding:8px 0}
.center{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:34px 0}
.rule{height:1px;background:var(--line);margin:22px 0;border:0}
.spacer{flex:1;min-height:20px}

/* ═════ السطح الزجاجي — واحد لكل شاشة ═════ */
.glass{
  background:var(--glass);
  border:1px solid var(--glass-line);
  border-radius:26px;
  box-shadow:var(--glass-shadow);
  padding:24px 20px;
  position:relative;
}
/* حافة ضوء علوية رفيعة — تُعرّف الزجاج بلا توهّج */
.glass::before{
  content:'';position:absolute;inset:0 14% auto;height:1px;border-radius:1px;
  background:linear-gradient(90deg,transparent,var(--edge),transparent);
}

/* أسطح مسطّحة — بلا ضبابية، بلا ظل */
.card{background:var(--flat);border:1px solid var(--flat-line);
  border-radius:var(--r);padding:16px 18px}

/* ───── الأزرار ───── */
.btn{
  display:block;width:100%;border:1px solid var(--btn-line);cursor:pointer;
  background:var(--btn-bg);color:var(--btn-ink);
  font-family:var(--display);font-size:16px;font-weight:500;
  padding:17px;border-radius:15px;
  transition:background .16s ease,transform .12s ease;
}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.988)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-soft);
  font-size:14px;padding:13px;font-family:var(--body)}
.btn.ghost:hover{color:var(--ink);background:transparent}
:focus-visible{outline:2px solid var(--glow);outline-offset:3px;border-radius:8px}

/* ───── نقاط التقدّم ───── */
.dots{display:flex;gap:5px;padding:20px 0 12px}
.pacebar{height:3px;border-radius:3px;background:transparent;margin:-4px 0 10px;overflow:hidden;
  display:flex;justify-content:flex-start}
.pacebar i{display:block;height:3px;width:0;border-radius:3px;background:var(--flat-line);
  transition:width .5s linear,background .5s ease,opacity .5s ease}
.dot{width:6px;height:6px;border-radius:50%;background:var(--flat-line);transition:background .3s ease}
.dot.on{background:var(--ink-soft)}
.dot.now{background:var(--glow);box-shadow:0 0 0 3px var(--glow-tint)}

/* ───── الخيارات: مسطّحة، والزجاج للحالة فقط ───── */
.choice{
  display:block;width:100%;text-align:right;
  background:var(--flat);border:1px solid var(--flat-line);border-radius:15px;
  padding:17px 18px;margin-bottom:9px;cursor:pointer;
  font-family:var(--body);font-size:17px;color:var(--ink);
  transition:border-color .16s ease,background .16s ease;
}
.choice:hover{border-color:var(--ink-faint)}
.choice:disabled{cursor:default}
.choice.right{
  background:var(--glass);
  border-color:var(--grow);color:var(--grow);font-weight:500;
  box-shadow:0 8px 26px rgba(0,0,0,.3);
}
.choice.chosen{background:transparent;border-color:var(--line);color:var(--ink-faint)}
.choice .mark{float:left;font-size:13px;opacity:.8}

/* ───── السؤال والشرح ───── */
.passage{background:var(--flat);border:1px solid var(--flat-line);border-radius:15px;
  padding:14px 16px;margin:14px 0 18px}
.p-head{display:flex;width:100%;justify-content:space-between;align-items:baseline;
  background:none;border:0;padding:0 0 4px;cursor:pointer;font-family:var(--display);
  font-size:14.5px;color:var(--ink);text-align:right}
.p-head .faint{font-family:var(--body);font-size:12.5px}
.p-para{font-size:14.5px;line-height:1.95;color:var(--ink-soft);margin:10px 0 0}
.p-para b{color:var(--glow);font-weight:500;margin-inline-end:4px}
.passage.folded{padding:12px 16px}
.fig-wrap{margin:16px 0 6px;padding:0;display:flex;justify-content:center}
.fig-wrap svg{display:block;max-width:100%}
.fig-wrap.sm{margin:8px 0 2px}
.fig-wrap.sm svg{height:96px}
.qimg{margin:14px 0 22px;padding:0;background:#F2F2F2;border-radius:14px;overflow:hidden;
  border:1px solid var(--flat-line)}
.qimg img{display:block;width:100%;height:auto}
.qimg.sm{margin:10px 0 4px;max-width:78%}
.ltr{direction:ltr;text-align:left}
.choice.ltr{text-align:left;padding-inline-start:18px}

.stem{font-size:18.5px;line-height:1.95;margin:16px 0 28px;font-weight:400;color:var(--ink);white-space:pre-line}
.skilltag{font-family:var(--display);font-size:13px;color:var(--ink-faint)}
.diag{background:var(--glow-tint);border:1px solid var(--btn-line);
  border-radius:13px;padding:14px 15px;font-size:14px;line-height:1.75;
  color:var(--btn-ink);margin:18px 0}
.steps{margin:20px 0 0;padding:0;list-style:none}
.steps li{font-size:15px;line-height:2.2;color:var(--ink-soft);font-variant-numeric:tabular-nums}

/* ───── خريطة الأفق ───── */
.horizon{position:relative;height:120px;margin:6px 0 2px;overflow:hidden}
.horizon.tall{height:200px}
.horizon svg{width:100%;height:100%;display:block}
.hz-label{font-family:var(--display);font-size:11.5px;fill:var(--ink-faint)}
.hz-label.here{fill:var(--ink);font-size:13px;font-weight:500}
.hz-you{font-family:var(--display);font-size:10.5px;fill:var(--glow);letter-spacing:.06em}

/* ───── القوائم ───── */
.group{margin-top:26px}
.group-h{display:flex;align-items:baseline;gap:9px;margin-bottom:10px}
.group-h .t{font-family:var(--display);font-size:17px}
.group-h .n{font-size:13px;color:var(--ink-faint)}
.srow{display:flex;align-items:center;gap:11px;padding:11px 0;
  border-bottom:1px solid var(--line);font-size:15px}
.srow:last-child{border-bottom:0}
.pip{width:8px;height:8px;border-radius:50%;flex:none}
.pip.built{background:var(--grow)}
.pip.near{background:var(--near)}
.pip.build{background:transparent;border:1.5px solid var(--ink-faint)}
.pip.paused{background:var(--flat-line)}
.srow .meta{margin-inline-start:auto;font-size:12.5px;color:var(--ink-faint)}

/* ───── متفرقات ───── */
.pill{display:inline-block;background:var(--flat);border:1px solid var(--flat-line);
  border-radius:999px;padding:6px 14px;font-size:12.5px;color:var(--ink-soft)}
.kv{display:flex;justify-content:space-between;align-items:center;
  padding:15px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border-bottom:0}
.kv .v{color:var(--ink-soft);font-size:14px}
.seg{display:flex;gap:7px;margin-top:9px}
.seg button{flex:1;background:var(--flat);border:1px solid var(--flat-line);
  border-radius:12px;padding:11px 4px;font-family:var(--body);font-size:13.5px;
  color:var(--ink-soft);cursor:pointer;line-height:1.6}
.seg button b{display:block;font-weight:400;font-size:12px;color:var(--ink-faint)}
.seg button.sel b{color:var(--ink-soft)}
.seg button.sel{border-color:var(--btn-line);color:var(--btn-ink);background:var(--btn-bg)}
/* ───── التبويبات العلوية ───── */
#tabs{order:-1}
.tabbar{position:relative;display:flex;gap:4px;padding:calc(env(safe-area-inset-top,0) + 10px) 14px 8px;
  perspective:700px}
.tabbar button{flex:1;background:none;border:0;padding:9px 2px 8px;cursor:pointer;
  font-family:var(--display);font-size:11.5px;color:var(--ink-faint);
  display:flex;flex-direction:column;align-items:center;gap:5px;
  border-radius:15px;transform-style:preserve-3d;
  transition:color .28s ease,transform .34s cubic-bezier(.34,1.56,.64,1),background .28s ease}
.tabbar button .ic{width:23px;height:23px;display:block;transform-style:preserve-3d;
  transition:transform .42s cubic-bezier(.34,1.56,.64,1)}
.tabbar button .ic svg{width:100%;height:100%;display:block;
  fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabbar button:active{transform:perspective(600px) rotateX(11deg) scale(.93)}
.tabbar button:active .ic{transform:translateZ(14px) scale(1.06)}
.tabbar button.sel{color:var(--ink);background:var(--flat)}
.tabbar button.sel .ic{transform:translateZ(10px)}
.tabbar button.sel .lb{font-weight:500}
.tabbar .glide{position:absolute;bottom:2px;height:2px;border-radius:2px;background:var(--glow);
  transition:transform .42s cubic-bezier(.34,1.56,.64,1),width .42s cubic-bezier(.34,1.56,.64,1);
  opacity:.9;pointer-events:none}
@keyframes tabpop{0%{transform:translateZ(10px) scale(1)}
  38%{transform:translateZ(20px) scale(1.22) rotate(-7deg)}
  70%{transform:translateZ(12px) scale(.97) rotate(3deg)}
  100%{transform:translateZ(10px) scale(1) rotate(0)}}
.tabbar button.sel .ic.pop{animation:tabpop .58s cubic-bezier(.34,1.56,.64,1)}
/* حسّ اللمس على الأزرار والخيارات */
.btn,.choice,.iconbtn,.thcard{transition:transform .2s cubic-bezier(.34,1.56,.64,1),
  border-color .22s ease,background .22s ease,color .22s ease}
.btn:active,.choice:active{transform:scale(.975)}
.iconbtn:active,.thcard:active{transform:perspective(500px) rotateX(9deg) scale(.94)}
.tswitch{display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-top:16px;padding:13px 15px;border:1px solid var(--flat-line);border-radius:14px;
  background:var(--flat);cursor:pointer}
.tswitch .lb{font-size:14.5px;color:var(--ink)}
.tswitch .sub{font-size:12.5px;color:var(--ink-faint);margin-top:3px}
.tswitch .kn{width:46px;height:27px;border-radius:14px;background:var(--flat-line);
  position:relative;flex:0 0 auto;transition:background .26s ease}
.tswitch .kn i{position:absolute;top:3px;inset-inline-start:3px;width:21px;height:21px;border-radius:50%;
  background:var(--ink-faint);transition:transform .3s cubic-bezier(.34,1.56,.64,1),background .26s ease}
.tswitch.on .kn{background:var(--btn-line)}
.tswitch.on .kn i{transform:translateX(-19px);background:var(--glow)}
@media(prefers-reduced-motion:reduce){
  .tabbar button,.tabbar button .ic,.tabbar .glide,.btn,.choice,.iconbtn,.thcard{transition:none!important;animation:none!important}
}
.note{font-size:13px;color:var(--ink-faint);line-height:1.8}
.brand{display:flex;align-items:center;gap:8px}
.brand svg{display:block}
.tip{border:1px solid var(--near);background:var(--near-tint);
  border-radius:14px;padding:15px 16px;margin:20px 0 4px}
.tip .lbl{font-family:var(--display);font-size:11.5px;letter-spacing:.12em;
  color:var(--near);margin-bottom:7px}
.tip.fact{border-color:var(--btn-line);background:var(--glow-tint)}
.tip.fact .lbl{color:var(--glow)}
.pip.know{background:var(--glow)}
.tip .t{font-size:15px;font-weight:500;margin-bottom:5px}
.tip .b{font-size:14px;line-height:1.75;color:var(--ink-soft)}
.faded{background:var(--flat);border:1px solid var(--flat-line);border-radius:14px;
  padding:14px 16px;margin:-10px 0 20px}
.faded .lbl{font-family:var(--display);font-size:11.5px;letter-spacing:.12em;
  color:var(--ink-faint);margin-bottom:9px}
.faded .st{font-size:15px;line-height:2;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.faded .st.blank{height:22px;border-bottom:1px dashed var(--flat-line);margin:6px 0 2px;width:62%}

.lmap{margin-top:14px;border:1px solid var(--flat-line);border-radius:13px;overflow:hidden}
.lmap .r{display:flex;align-items:center;gap:10px;padding:9px 13px;font-size:14px;border-bottom:1px solid var(--flat-line)}
.lmap .r:last-child{border-bottom:0}
.lmap .r .nm{flex:1;color:var(--ink)}
.lmap .r .pc{color:var(--ink-faint);font-size:12.5px;font-variant-numeric:tabular-nums;min-width:34px;text-align:left}
.lmap .r .bar{height:5px;border-radius:3px;background:var(--grow);opacity:.55;min-width:3px}
.lmap .r.dim .nm{color:var(--ink-soft)}
.trap{border:1px solid var(--btn-line);border-radius:13px;padding:13px 15px;margin-top:16px;
  font-size:14.5px;line-height:1.85;color:var(--ink-soft)}
.trap b{color:var(--ink)}

.namefield{width:100%;margin-top:18px;padding:14px 16px;border-radius:14px;background:var(--flat);
  border:1px solid var(--flat-line);color:var(--ink);font-size:16.5px;font-family:inherit;
  outline:none;transition:border-color .25s}
.namefield:focus{border-color:var(--glow)}
.namefield.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}
  50%{transform:translateX(5px)}80%{transform:translateX(-3px)}}
.tracks{display:flex;flex-direction:column;gap:9px;margin-top:20px;perspective:800px}
.tcard{display:flex;align-items:center;gap:13px;width:100%;text-align:start;cursor:pointer;
  background:var(--flat);border:1px solid var(--flat-line);border-radius:17px;padding:15px 16px;
  color:var(--ink);font-family:inherit;transform-style:preserve-3d;
  transition:transform .32s cubic-bezier(.34,1.56,.64,1),border-color .28s,background .28s}
.tcard:active{transform:perspective(600px) rotateX(9deg) scale(.965)}
.tcard .ic{color:var(--a);flex:0 0 auto;display:flex;transition:transform .34s cubic-bezier(.34,1.56,.64,1)}
.tcard:active .ic{transform:translateZ(16px) scale(1.08)}
.tcard .tx{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.tcard .nm{font-size:16.5px;font-family:var(--display)}
.tcard .tg{font-size:11.5px;color:var(--ink-faint)}
.tcard .st{font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums;
  flex:0 0 auto;text-align:end;line-height:1.5}
.tcard.started .st{color:var(--a)}
.tcard.sel{background:var(--at);border-color:var(--a)}
.greet{margin-top:12px;padding:15px 16px;border-radius:17px;background:var(--flat);
  border:1px solid var(--flat-line)}
.greet .gl{font-family:var(--display);font-size:17px;line-height:1.6;color:var(--ink)}
.gstats{display:flex;gap:8px;margin-top:14px}
.gstats div{flex:1;text-align:center}
.gstats b{display:block;font-family:var(--display);font-size:20px;font-weight:400;
  font-variant-numeric:tabular-nums;color:var(--glow);line-height:1.35}
.gstats span{font-size:11px;color:var(--ink-faint)}
.gbar{height:4px;border-radius:3px;background:var(--void);margin-top:13px;overflow:hidden}
.gbar i{display:block;height:100%;background:var(--glow);border-radius:3px;
  transition:width .9s cubic-bezier(.2,.8,.3,1)}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.lhero{display:flex;gap:13px;align-items:flex-start;margin-top:6px}

.drill{margin:0;padding:0;list-style:none;counter-reset:d}

  background:var(--flat);border-radius:13px;font-size:13.5px;line-height:1.7;color:var(--ink)}
.drill li::before{content:counter(d);position:absolute;inset-inline-start:13px;top:11px;
  width:22px;height:22px;border-radius:7px;background:var(--glow);color:var(--void);
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:12.5px}

.lmap .r .track{width:74px;height:6px;border-radius:4px;background:var(--void);overflow:hidden;flex:0 0 auto}
.lmap .r .track i{display:block;height:100%;width:0;border-radius:4px;background:var(--glow);
  animation:fill .85s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--d,0ms) + 260ms)}
@keyframes fill{to{width:var(--w)}}
.trap{position:relative;padding-top:30px}
.trap .th{position:absolute;top:11px;inset-inline-start:15px;font-family:var(--display);font-size:10.5px;
  letter-spacing:.16em;color:var(--warn,#D9A96A)}
.wex .o{animation:rise .42s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--d,0ms) + 120ms)}

}



.pc-h span:first-child{font-family:var(--display);font-size:10.5px;letter-spacing:.18em;color:var(--glow)}




.pc-s li::before{content:counter(p);width:16px;height:16px;border-radius:5px;background:var(--glow);

/* ── انتقال الشاشات ── */
@keyframes inF{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@keyframes inB{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
#app>.fade.inF{animation:inF .38s cubic-bezier(.22,.8,.28,1) both}
#app>.fade.inB{animation:inB .38s cubic-bezier(.22,.8,.28,1) both}
/* ── ظهور الخيارات متتابعًا ── */

.choice.pop{animation:popIn .34s cubic-bezier(.22,.8,.28,1) both;animation-delay:var(--d,0ms)}
.choice{position:relative;overflow:hidden}
.choice::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%),var(--glow-tint),transparent 62%);
  opacity:0;transition:opacity .4s ease}
.choice:active::after{opacity:1;transition:opacity .1s}
/* ── شريط تقدّم الجلسة ── */
.rail{position:relative;height:3px;border-radius:3px;background:var(--flat);margin:2px 0 18px;overflow:visible}
.rail i{display:block;height:100%;border-radius:3px;background:var(--glow);

  font-family:var(--display);font-variant-numeric:tabular-nums}
/* ── عمق وطبقات ── */
.glass,.wex,
.glass::before,.pocket::before{content:'';position:absolute;inset:0;border-radius:inherit;
  pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 46%)}
h1{letter-spacing:-.012em}
@media(prefers-reduced-motion:reduce){

}

/* ── لحظة الدخول إلى المسار ── */
.veil{position:fixed;inset:0;z-index:60;pointer-events:none;
  background:radial-gradient(circle at var(--ox,50%) var(--oy,50%),
    color-mix(in srgb, var(--a) 92%, #000 8%) 0%,

  animation:veilIn .62s cubic-bezier(.4,0,.2,1) forwards}

@keyframes veilIn{to{clip-path:circle(160% at var(--ox,50%) var(--oy,50%))}}

  100%{clip-path:circle(160% at 50% 50%);opacity:0;transform:scale(1.06)}}

/* ═══ الهوية الزجاجية — أسطح بارزة فقط ═══ */
#shell::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.9;
  background:
   radial-gradient(880px 620px at 84% -10%, color-mix(in srgb, var(--glow) 22%, transparent), transparent 62%),
   radial-gradient(680px 520px at 6% 104%, color-mix(in srgb, var(--glow) 14%, transparent), transparent 64%)}
#app,#tabs{position:relative;z-index:1}
/* الزجاج: للبطاقات الرئيسة فقط، لا للصفوف */
.glass,.pocket,.wex,.greet,.idcard,.trap,.key{
  backdrop-filter:blur(18px) saturate(135%);-webkit-backdrop-filter:blur(18px) saturate(135%)}
.glass{background:color-mix(in srgb, var(--ink) 4%, transparent);
  border:1px solid color-mix(in srgb, var(--ink) 8%, transparent);
  box-shadow:0 1px 0 color-mix(in srgb, var(--ink) 6%, transparent) inset,
             0 22px 46px -30px rgba(0,0,0,.92)}
.greet,.pocket,.wex{position:relative;overflow:hidden}
.greet::after,.pocket::after,.wex::after,.glass::after{content:'';position:absolute;inset:0;
  pointer-events:none;border-radius:inherit;
  background:linear-gradient(166deg, color-mix(in srgb, var(--ink) 6%, transparent), transparent 44%)}
.greet{border:1px solid color-mix(in srgb, var(--ink) 8%, transparent);
  background:color-mix(in srgb, var(--glow) 7%, transparent)}
/* حافة مضيئة بلون المسار على البطاقة الرئيسة */

  border-radius:2px;background:var(--glow);opacity:.55}

.gstats,.gbar,.gfoot{padding-inline-start:12px}
/* عمق للأزرار الرئيسة */
.btn{box-shadow:0 1px 0 color-mix(in srgb, var(--ink) 9%, transparent) inset,
                0 14px 28px -20px rgba(0,0,0,.85)}
/* شريط التبويبات يطفو */
.tabbar{backdrop-filter:blur(20px) saturate(130%);-webkit-backdrop-filter:blur(20px) saturate(130%)}
.tabbar button.sel{background:color-mix(in srgb, var(--glow) 12%, transparent);
  box-shadow:0 1px 0 color-mix(in srgb, var(--ink) 8%, transparent) inset}
