/* ── زرّ الاستماع ── */
.lsn{display:inline-flex;align-items:center;gap:8px;margin-top:15px;padding:9px 15px;
  border-radius:999px;background:var(--flat);border:1px solid var(--flat-line);
  color:var(--ink-soft);font-family:inherit;font-size:12.5px;cursor:pointer;
  transition:transform .24s cubic-bezier(.34,1.5,.64,1),border-color .25s,color .25s}
.lsn:active{transform:scale(.955)}
.lsn.on{border-color:var(--glow);color:var(--glow);background:var(--glow-tint)}
.lsn .lw{display:inline-flex;align-items:flex-end;gap:2px;height:12px;font-size:11px;letter-spacing:-.05em}
.lsn.on .lw i{display:block;width:2.5px;background:var(--glow);border-radius:2px;
  animation:wv .9s ease-in-out infinite}
.lsn.on .lw i:nth-child(1){height:6px;animation-delay:0s}
.lsn.on .lw i:nth-child(2){height:12px;animation-delay:.15s}
.lsn.on .lw i:nth-child(3){height:8px;animation-delay:.3s}
@keyframes wv{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}

.topr{display:flex;align-items:center;gap:10px;margin-inline-start:auto}
.daybtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;
  border-radius:12px;background:var(--flat);border:1px solid var(--flat-line);
  color:var(--ink-faint);cursor:pointer;flex:0 0 auto;
  transition:transform .3s cubic-bezier(.34,1.5,.64,1),color .28s,border-color .28s}
.daybtn:active{transform:scale(.9) rotate(-18deg)}
.daybtn:hover{color:var(--ink-soft)}

/* ── شريط الهويّة الثابت ── */
#brandbar{flex:0 0 auto;z-index:40;display:flex;align-items:center;gap:9px;
  padding:11px 20px 10px;
  background:var(--void);border-bottom:1px solid var(--flat-line)}
#brandbar[hidden]{display:none}
.bmark{display:inline-flex;color:var(--glow);opacity:.9}
.bname{font-family:var(--display);font-size:14px;color:var(--ink-soft);letter-spacing:.02em}
.gearbtn{margin-inline-start:auto;display:inline-flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:11px;background:transparent;border:none;
  color:var(--ink-faint);cursor:pointer;transition:transform .35s cubic-bezier(.34,1.5,.64,1),color .25s}
.gearbtn:active{transform:rotate(58deg) scale(.92)}
.gearbtn:hover{color:var(--ink-soft)}

.flagpick{margin-top:15px;padding:15px 14px;border-radius:16px;background:var(--flat);
  border:1px dashed var(--flat-line)}
.flagpick .fq{font-size:12.5px;color:var(--ink-faint);margin-bottom:10px}
.fbo{display:block;width:100%;text-align:start;padding:12px 14px;margin-bottom:7px;
  border-radius:12px;background:var(--solid);border:1px solid var(--flat-line);
  color:var(--ink-soft);font-family:inherit;font-size:13px;cursor:pointer;
  transition:transform .22s cubic-bezier(.34,1.5,.64,1),border-color .22s}
.fbo:active{transform:scale(.98);border-color:var(--btn-line)}
.fbx{display:block;width:100%;padding:9px;background:transparent;border:none;
  color:var(--ink-faint);font-family:inherit;font-size:12px;cursor:pointer}

/* ── مسار تعلّم الأفكار ── */
.pbar{margin-top:18px;padding:14px 15px;border-radius:16px;background:var(--flat);
  border:1px solid var(--flat-line)}
.pb-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink-soft)}
.pb-n{font-family:var(--display);color:var(--glow);font-variant-numeric:tabular-nums}
.pb-t{height:5px;border-radius:4px;background:var(--void);margin-top:10px;overflow:hidden}
.pb-t i{display:block;height:100%;background:var(--glow);border-radius:4px;
  transition:width .8s cubic-bezier(.22,.8,.28,1)}
.pmap{margin-top:20px;position:relative}
.pstage{font-size:11px;letter-spacing:.1em;color:var(--ink-faint);margin:20px 0 10px;
  padding-inline-start:2px}
.pstage:first-child{margin-top:4px}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:start;
  padding:13px 14px;margin-bottom:7px;border-radius:15px;background:var(--flat);
  border:1px solid transparent;color:var(--ink);font-family:inherit;cursor:pointer;
  transition:transform .24s cubic-bezier(.34,1.5,.64,1),border-color .25s,background .25s}
.prow:active{transform:scale(.984)}
.prow .pn{width:26px;height:26px;border-radius:9px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:12px;
  background:var(--void);color:var(--ink-faint);font-variant-numeric:tabular-nums}
.prow .pt{flex:1;min-width:0;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.prow .nm{font-size:14px}
.prow .ar{color:var(--ink-faint);font-size:14px}
.prow.done{opacity:.62}
.prow.done .pn{background:var(--glow-tint);color:var(--glow)}
.prow.now{background:var(--glow-tint);border-color:var(--glow)}
.prow.now .pn{background:var(--glow);color:var(--void)}
.prow.now .nm{color:var(--glow)}
.pnow{font-size:10.5px;color:var(--glow);border:1px solid var(--glow);
  padding:2px 7px;border-radius:999px;opacity:.85}
.pst{font-size:10.5px;color:var(--ink-faint)}

.pdone{margin-top:18px;padding:20px 18px;border-radius:20px;text-align:center;
  background:var(--glow-tint);border:1px solid var(--glow)}
.pd-m{display:flex;justify-content:center;color:var(--glow);margin-bottom:12px}
.pd-t{font-family:var(--display);font-size:20px;color:var(--glow)}
.pd-b{font-size:12.5px;line-height:1.9;color:var(--ink-soft);margin-top:9px}

/* ── شاشة الرحلة ── */
.wglyph{display:flex;justify-content:center;color:var(--glow);margin-top:34px;
  animation:wgIn .8s cubic-bezier(.22,.9,.28,1) both}
@keyframes wgIn{from{opacity:0;transform:scale(.7) translateY(14px)}to{opacity:1;transform:none}}
.wmotto{text-align:center;font-size:14px;line-height:2;color:var(--ink-soft);
  margin:14px auto 0;max-width:19em;font-family:var(--display)}

/* ── بطاقة التعريف ── */
.icard{position:relative;margin-top:22px;padding:30px 22px 24px;border-radius:26px;
  background:linear-gradient(160deg,var(--glow-tint),transparent 62%),var(--flat);
  border:1px solid var(--flat-line);overflow:hidden;
  animation:icIn .5s cubic-bezier(.22,.9,.28,1) both}
@keyframes icIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.ic-n{position:absolute;inset-inline-end:16px;top:6px;font-family:var(--display);
  font-size:104px;line-height:1;color:var(--glow);opacity:.11;pointer-events:none}
.ic-t{font-size:25px;line-height:1.45;margin:0;position:relative}
.ic-b{font-size:14.5px;line-height:2.05;color:var(--ink-soft);margin-top:15px}
.ic-k{position:relative;margin-top:20px;padding:15px 16px 15px 40px;border-radius:15px;
  background:var(--void);font-family:var(--display);font-size:14.5px;line-height:1.8;
  color:var(--glow)}
.ic-q{position:absolute;inset-inline-start:14px;top:6px;font-size:38px;line-height:1;
  color:var(--glow);opacity:.32}

/* ══ مشاهد مفتاح الحلّ ══ */
.lbar2{display:flex;align-items:center;gap:12px;padding:4px 0 14px}
.lb-l{display:flex;align-items:center;gap:9px;min-width:0}
.lb-tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.lb-w{font-size:10.5px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:15em}
.lb-l .lg{color:var(--glow);flex:0 0 auto}
.lb-n{font-family:var(--display);font-size:15px;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail{display:flex;gap:6px;margin-inline-start:auto;flex:0 0 auto}
.rl{width:22px;height:22px;padding:0;background:transparent;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.rl i{display:block;width:7px;height:7px;border-radius:50%;background:var(--flat-line);
  transition:all .38s cubic-bezier(.34,1.5,.64,1)}
.rl.past i{background:var(--glow);opacity:.4}
.rl.on i{width:20px;border-radius:5px;background:var(--glow)}

.lscene{animation:scIn .46s cubic-bezier(.22,.9,.28,1) both}
@keyframes scIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.sc-h{font-size:11px;letter-spacing:.14em;color:var(--ink-faint);margin-bottom:14px}
.sc{position:relative}

/* ① المفتاح */
.sc-key{padding:30px 22px 24px;border-radius:26px;text-align:center;
  background:radial-gradient(120% 90% at 50% 0%,var(--glow-tint),transparent 70%),var(--flat);
  border:1px solid var(--glow)}
.sk-q{font-family:var(--display);font-size:56px;line-height:.7;color:var(--glow);opacity:.3}
.sk-t{font-family:var(--display);font-size:24px;line-height:1.65;color:var(--ink);margin-top:10px}
.sk-t b{color:var(--glow);font-weight:400}
.sk-c{font-size:13px;line-height:1.95;color:var(--ink-soft);margin-top:18px;
  padding-top:16px;border-top:1px dashed var(--flat-line)}

/* ② التعرّف */
.sc-q{font-size:13.5px;color:var(--ink-soft);margin-bottom:15px}
.sig{display:flex;flex-direction:column;gap:9px}
.sg{display:flex;gap:12px;align-items:flex-start;padding:14px 15px;border-radius:16px;
  background:var(--flat);border:1px solid var(--flat-line);
  animation:sgIn .5s cubic-bezier(.22,.9,.28,1) both;animation-delay:var(--d)}
@keyframes sgIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.rad{position:relative;width:10px;height:10px;border-radius:50%;background:var(--glow);
  flex:0 0 auto;margin-top:6px}
.rad::after{content:'';position:absolute;inset:-5px;border-radius:50%;
  border:1px solid var(--glow);opacity:0;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.6);opacity:0}}
.sgt{font-size:14px;line-height:1.85;color:var(--ink)}
.sgt b{color:var(--glow);font-weight:400}

/* ③ الخطوات */
.stair{position:relative;padding-inline-start:6px}
.stp{position:relative;display:flex;gap:13px;align-items:flex-start;
  padding:0 0 20px 0;animation:sgIn .5s cubic-bezier(.22,.9,.28,1) both;animation-delay:var(--d)}
.stp:last-child{padding-bottom:0}
.stp::before{content:'';position:absolute;inset-inline-start:14px;top:30px;bottom:0;
  width:1px;background:linear-gradient(var(--glow),transparent);opacity:.35}
.stp:last-child::before{display:none}
.stn{width:29px;height:29px;border-radius:11px;flex:0 0 auto;display:flex;
  align-items:center;justify-content:center;font-family:var(--display);font-size:13px;
  background:var(--glow-tint);color:var(--glow);border:1px solid var(--glow)}
.stt{font-size:14px;line-height:1.9;color:var(--ink);padding-top:4px}
.stt b{color:var(--glow);font-weight:400}

/* ④ المصيدة */
.tw{display:flex;gap:13px;padding:17px 16px;border-radius:19px;
  background:rgba(217,169,106,.09);border:1px solid rgba(217,169,106,.32)}
.twi{width:26px;height:26px;border-radius:9px;flex:0 0 auto;display:flex;
  align-items:center;justify-content:center;background:#D9A96A;color:var(--void);
  font-family:var(--display);font-size:15px}
.twt{font-size:13.5px;line-height:1.95;color:var(--ink-soft)}
.twt b{color:#D9A96A;font-weight:400}
.face{margin-top:16px}
.fc{padding:16px 15px;border-radius:18px;background:var(--flat);
  border:1px solid var(--flat-line);border-inline-start:2px solid;
  animation:sgIn .5s cubic-bezier(.22,.9,.28,1) both;animation-delay:var(--d)}
.fc.bad{border-inline-start-color:#D98C8C}
.fc.good{border-inline-start-color:#7CC7A6}
.fl{font-size:11px;letter-spacing:.06em;margin-bottom:8px}
.fc.bad .fl{color:#D98C8C}
.fc.good .fl{color:#7CC7A6}
.ft{font-size:13.5px;line-height:1.9;color:var(--ink-soft)}
.ft b{color:var(--ink);font-weight:400}
.fvs{text-align:center;font-size:10.5px;letter-spacing:.16em;color:var(--ink-faint);
  padding:11px 0}

/* ⑥ المثال */
.sc-ex .steps{margin-top:16px}

/* ══════ هويّة الأفكار — مستقلّة عن ألوان التدريب ══════ */
.lwrap.ideas{
  --idea:#E0D2B4; --idea-soft:#B8A98C; --idea-tint:rgba(224,210,180,.085);
  --idea-line:rgba(224,210,180,.19);
  --glow:var(--idea); --glow-tint:var(--idea-tint);
  position:relative}
[data-mode="day"] .lwrap.ideas{
  --idea:#5E4F35; --idea-soft:#7C6C4E; --idea-tint:rgba(94,79,53,.075);
  --idea-line:rgba(94,79,53,.18)}
.lwrap.ideas::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(90% 55% at 50% 0%,var(--idea-tint),transparent 72%)}
.lwrap.ideas .lb-l .lg{color:var(--idea)}
.lwrap.ideas .lb-n{color:var(--idea)}
.lwrap.ideas .rl.on i,.lwrap.ideas .rl.past i{background:var(--idea)}
.lwrap.ideas .sc-h{color:var(--idea-soft);opacity:.75}
.lwrap.ideas .btn.ghost{border-color:var(--idea-line);color:var(--idea)}

/* ⓪ مشهد الفكرة */
.sc-open{display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;min-height:52vh;padding:10px 0}
.so-e{font-size:11px;letter-spacing:.34em;color:var(--idea-soft);opacity:.7;
  animation:soF .6s ease both}


.so-w{font-size:13.5px;line-height:2.1;color:var(--ink-soft);max-width:21em;
  animation:soF .7s ease both .55s}
@keyframes soF{from{opacity:0}to{opacity:1}}
@keyframes soUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes soW{from{width:0;opacity:0}to{width:44px;opacity:.4}}

/* ── شاشة الاسم: تدفّق صريح، لا تداخل ── */




.namewrap{display:block;padding:30px 0 24px;min-height:100%}
.namelogo{display:flex;justify-content:center;margin-bottom:22px;color:var(--glow)}
.namefield{position:relative;z-index:5;margin-top:22px;padding:17px 16px;
  font-size:17px;text-align:center;-webkit-user-select:text;user-select:text;
  touch-action:manipulation}
.namebtn{margin-top:22px;position:relative;z-index:1}

.dr-go{margin-top:24px;padding-bottom:8px}
.dr-go .btn{margin-bottom:6px}

/* ══ أشكال الأسئلة ══ */
.sv{margin:16px 0 26px}
.sv-ask{font-size:14px;line-height:1.9;color:var(--ink-soft);margin-bottom:16px}

/* التناظر */
.sv-an{text-align:center;padding:10px 0}
.an-p{display:inline-flex;align-items:center;gap:12px;padding:15px 20px;border-radius:18px;
  background:var(--flat);border:1px solid var(--flat-line)}
.an-w{font-family:var(--display);font-size:21px;color:var(--ink)}
.an-w.q{color:var(--glow);opacity:.55}
.an-c{color:var(--glow);font-size:17px;opacity:.7}
.an-vs{font-size:10.5px;letter-spacing:.22em;color:var(--ink-faint);padding:13px 0}
.an-p.ask{border-style:dashed;border-color:var(--glow);background:var(--glow-tint)}

/* المفردة الشاذّة */
.sv-ask.big{font-size:18px;color:var(--ink);line-height:1.9;margin-bottom:8px}
.od-hint{font-size:12.5px;color:var(--ink-faint);margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{padding:12px 17px;border-radius:14px;background:var(--flat);
  border:1px solid var(--flat-line);font-size:16px;color:var(--ink);
  animation:chIn .42s cubic-bezier(.22,.9,.28,1) both;animation-delay:var(--d)}
@keyframes chIn{from{opacity:0;transform:translateY(9px) scale(.96)}to{opacity:1;transform:none}}

/* المقارنات */
.cmp2{display:flex;align-items:stretch;gap:10px}
.cv{flex:1;min-width:0;padding:17px 14px;border-radius:17px;background:var(--flat);
  border:1px solid var(--flat-line);text-align:center;display:flex;
  flex-direction:column;justify-content:center;gap:9px}
.cl{font-size:10.5px;letter-spacing:.1em;color:var(--ink-faint)}
.cx{font-family:var(--display);font-size:19px;line-height:1.6;color:var(--ink);
  white-space:pre-line;word-break:break-word}
.cx.ltr{direction:ltr}
.cmid{align-self:center;width:30px;height:30px;border-radius:50%;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;color:var(--glow);
  background:var(--glow-tint);border:1px solid var(--glow);font-size:14px}

/* الخطأ السياقي */
.quote{position:relative;padding:20px 44px 20px 18px;border-radius:19px;
  background:var(--flat);border:1px solid var(--flat-line);
  border-inline-start:2px solid var(--glow);
  font-size:17px;line-height:2.05;color:var(--ink)}
.qm{position:absolute;inset-inline-start:14px;top:8px;font-family:var(--display);
  font-size:36px;line-height:1;color:var(--glow);opacity:.35}

/* الفراغ في الإكمال */
.blankx{display:inline-block;width:5.2em;height:1.05em;vertical-align:-.18em;
  margin:0 .18em;border-radius:5px;background:var(--glow-tint);
  border-bottom:2px solid var(--glow)}

/* ══ الأفق ══ */
.hz{padding:14px 0 4px;position:relative}
.hz svg{display:block;overflow:visible}
.hz-sun{filter:drop-shadow(0 0 9px var(--glow));
  transition:cx .75s cubic-bezier(.3,.9,.3,1),cy .75s cubic-bezier(.3,.9,.3,1),r .6s ease}
.hz-t{display:flex;justify-content:space-between;align-items:baseline;
  margin-top:-6px;font-size:11px;color:var(--ink-faint)}
.hz-n{font-variant-numeric:tabular-nums;font-family:var(--display);color:var(--glow);opacity:.85}

/* ══ لحظة الإجابة ══ */
@keyframes ringOut{0%{transform:scale(.82);opacity:.55}100%{transform:scale(1.06);opacity:0}}
.choice.right::before{content:'';position:absolute;inset:-2px;border-radius:inherit;
  border:2px solid var(--grow);animation:ringOut .72s cubic-bezier(.2,.8,.3,1) forwards;
  pointer-events:none}
@keyframes settle{0%{transform:translateX(0)}22%{transform:translateX(-5px)}
  48%{transform:translateX(3px)}72%{transform:translateX(-1.5px)}100%{transform:translateX(0)}}
.choice.chosen.wrong{animation:settle .48s cubic-bezier(.36,.07,.19,.97) both}
.choice.right{animation:liftIn .5s cubic-bezier(.22,.9,.28,1) both}
@keyframes liftIn{0%{transform:translateY(3px) scale(.995)}100%{transform:none}}

/* ══ لمحات ══ */
/* ضوء يتبع الاختيار */
.choice{position:relative;overflow:hidden}
.choice::after{content:'';position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(140px 90px at var(--mx,50%) var(--my,50%),
    var(--glow-tint),transparent 68%);
  opacity:0;transition:opacity .5s ease;pointer-events:none}
.choice:active::after{opacity:1}

/* نبض هادئ للشمس عند الوقوف */
@keyframes sunBreath{0%,100%{filter:drop-shadow(0 0 9px var(--glow))}
  50%{filter:drop-shadow(0 0 15px var(--glow))}}
.hz-sun{animation:sunBreath 4.2s ease-in-out infinite}

/* حَبك ناعم للبطاقات عند الظهور */
.glass{animation:cardIn .5s cubic-bezier(.22,.9,.28,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* الزرّ الرئيس: بريق يمرّ مرّة عند الظهور */
.btn:not(.ghost){position:relative;overflow:hidden}
.btn:not(.ghost)::after{content:'';position:absolute;top:0;bottom:0;width:38%;
  inset-inline-start:-40%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.09),transparent);
  animation:sheen 2.6s cubic-bezier(.4,0,.2,1) .5s 1 forwards}
@keyframes sheen{to{inset-inline-start:120%}}

/* الترويسة: خيط أفق رفيع تحتها */
#brandbar{position:relative}
#brandbar::after{content:'';position:absolute;inset-inline:20px;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--glow),transparent);opacity:.35}

@media (prefers-reduced-motion:reduce){
  .hz-sun,.glass,.btn:not(.ghost)::after{animation:none!important}
}

/* ══ نظام الارتفاع: ثلاثة مستويات، ظلّ فيزيائيّ، حافّة ضوء ══ */
:root{
  --e1: 0 1px 2px rgba(0,0,0,.24), 0 2px 8px rgba(0,0,0,.16);
  --e2: 0 2px 5px rgba(0,0,0,.26), 0 10px 26px rgba(0,0,0,.22);
  --e3: 0 6px 14px rgba(0,0,0,.3), 0 22px 54px rgba(0,0,0,.3);
  --rim: inset 0 1px 0 rgba(255,255,255,.055);
}
[data-mode="day"]{
  --e1: 0 1px 2px rgba(24,32,48,.06), 0 2px 8px rgba(24,32,48,.05);
  --e2: 0 2px 6px rgba(24,32,48,.07), 0 10px 26px rgba(24,32,48,.07);
  --e3: 0 6px 16px rgba(24,32,48,.09), 0 22px 54px rgba(24,32,48,.1);
  --rim: inset 0 1px 0 rgba(255,255,255,.7);
}
.glass{box-shadow:var(--e2),var(--rim)}
.choice{box-shadow:var(--e1),var(--rim)}
.choice.right,.choice.chosen{box-shadow:var(--e2),var(--rim)}
.btn:not(.ghost){box-shadow:var(--e2),var(--rim)}
.lead,.icard,.sc-key,.prow.now{box-shadow:var(--e2),var(--rim)}
.sheet-in{box-shadow:var(--e3)}
.sg,.stp .stn,.chip,.cv,.quote,.an-p{box-shadow:var(--e1)}

/* ══ الطباعة: أرقام جدوليّة، إيقاع عربيّ، بلا تباعد يشوّه ══ */
body,input,button,textarea{font-feature-settings:"tnum" 1,"ss01" 1;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3{letter-spacing:0;text-wrap:balance}
h1{font-size:clamp(23px,6.4vw,28px);line-height:1.45}
.num,.hz-n,.sgrid b,.gstats b,.pb-n,.ld-n{font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1}
.soft,.faint,p{text-wrap:pretty}
.stem{letter-spacing:0}

/* ══ ختام الجلسة ══ */
.crest{text-align:center;padding:6px 0 4px}
.crest svg{display:block;overflow:visible}
.cr-s{animation:rise 1.5s cubic-bezier(.2,.85,.25,1) .12s both;
  filter:drop-shadow(0 0 12px var(--glow))}
.cr-h{animation:rise 1.5s cubic-bezier(.2,.85,.25,1) .12s both}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-40px)}}
.cr-ray{animation:rayIn .9s ease .95s both;transform-origin:150px 46px}
@keyframes rayIn{from{opacity:0;transform:translateY(-40px) scale(.6)}
  to{opacity:.5;transform:translateY(-40px) scale(1)}}
.cr-t{margin-top:14px;font-size:clamp(22px,6.2vw,27px);
  animation:cardIn .6s cubic-bezier(.22,.9,.28,1) .5s both}
.cr-b{margin-top:8px;animation:cardIn .6s cubic-bezier(.22,.9,.28,1) .66s both}
@media (prefers-reduced-motion:reduce){
  .cr-s,.cr-h{animation:none;transform:translateY(-40px)}
  .cr-ray{animation:none;opacity:.5;transform:translateY(-40px)}
  .cr-t,.cr-b{animation:none}
}

/* ══ الفجر: وهج يعلو مع تقدّم الجلسة ══ */
#shell::after{content:'';position:fixed;inset-inline:0;bottom:0;height:46%;
  pointer-events:none;z-index:0;
  background:radial-gradient(120% 100% at 50% 118%,
    color-mix(in srgb, var(--glow) 60%, transparent) 0%, transparent 62%);
  opacity:var(--dawn,.06);
  transition:opacity 1.4s cubic-bezier(.3,.8,.3,1)}
#app,#brandbar,#tabs{position:relative;z-index:1}

/* حافّة زجاجيّة أدقّ */
.glass{position:relative}
.glass::after{content:'';position:absolute;inset:0;border-radius:inherit;
  pointer-events:none;padding:1px;
  background:linear-gradient(150deg,
    color-mix(in srgb, var(--glow) 34%, transparent),
    transparent 42%, transparent 62%,
    color-mix(in srgb, var(--ink) 8%, transparent));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;opacity:.5}

/* الأزرار: ردّ فعل طبيعيّ */
.btn{transition:transform .34s cubic-bezier(.34,1.55,.64,1),
  box-shadow .3s ease,border-color .3s ease,background .3s ease}
.btn:active{transform:translateY(1px) scale(.985)}
.choice{transition:transform .3s cubic-bezier(.34,1.5,.64,1),
  border-color .28s ease,background .28s ease,box-shadow .28s ease,color .28s ease}

.stabs{display:flex;gap:6px;margin:18px 0 16px;padding:4px;border-radius:15px;
  background:var(--flat);border:1px solid var(--flat-line)}
.stb{flex:1;padding:10px 6px;border-radius:11px;background:transparent;border:none;
  color:var(--ink-faint);font-family:inherit;font-size:12.5px;cursor:pointer;
  transition:background .3s ease,color .3s ease}
.stb.on{background:var(--glow-tint);color:var(--glow)}

/* ══ دفتر الأخطاء ══ */
.ebar{display:flex;align-items:stretch;margin-top:18px;padding:16px 10px;border-radius:19px;
  background:var(--flat);border:1px solid var(--flat-line);box-shadow:var(--e1),var(--rim)}
.eb-r{flex:1;text-align:center}
.eb-n{font-family:var(--display);font-weight:300;font-size:27px;color:var(--ink);
  font-variant-numeric:tabular-nums;line-height:1.2}
.eb-n.open{color:var(--glow)}
.eb-l{font-size:11px;color:var(--ink-faint);margin-top:4px}
.eb-sep{width:1px;background:var(--flat-line)}
.ehint{display:flex;align-items:center;gap:12px;margin-top:13px;padding:15px 15px;
  border-radius:17px;background:var(--glow-tint);border:1px solid var(--glow);
  font-size:13px;line-height:1.85;color:var(--ink-soft)}
.ehint b{color:var(--glow);font-weight:400}
.eh-i{color:var(--glow);flex:0 0 auto;font-size:15px}
.eh-b{margin-inline-start:auto;flex:0 0 auto;padding:8px 13px;border-radius:11px;
  background:transparent;border:1px solid var(--glow);color:var(--glow);
  font-family:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
.egrp{margin-top:20px}
.eg-h{display:flex;align-items:baseline;gap:9px;margin-bottom:9px}
.eg-n{font-family:var(--display);font-size:15px;color:var(--ink)}
.eg-c{font-size:11.5px;color:var(--ink-faint)}
.eg-c::before{content:'';display:inline-block;width:4px;height:4px;border-radius:50%;
  background:var(--ink-faint);margin-inline-end:7px;vertical-align:middle}
.erow{display:flex;align-items:baseline;gap:11px;padding:11px 13px;margin-bottom:6px;
  border-radius:13px;background:var(--flat);border-inline-start:2px solid var(--flat-line)}
.erow.soon{border-inline-start-color:var(--glow);background:var(--glow-tint)}
.ed{font-size:11px;color:var(--ink-faint);flex:0 0 auto;min-width:4.6em}
.erow.soon .ed{color:var(--glow)}
.et{font-size:13px;line-height:1.75;color:var(--ink-soft);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eempty{text-align:center;padding:46px 12px}
.ee-m{display:flex;justify-content:center;color:var(--glow);opacity:.4;margin-bottom:16px}

/* ══ ما تغيّر فيك ══ */
.dlt{margin-top:18px;padding:18px 17px 16px;border-radius:21px;
  background:linear-gradient(165deg,var(--glow-tint),transparent 68%),var(--flat);
  border:1px solid var(--flat-line);box-shadow:var(--e2),var(--rim)}
.dlt.soonly{display:flex;gap:12px;align-items:flex-start;font-size:13px;
  line-height:1.9;color:var(--ink-soft)}
.dlt.soonly b{color:var(--glow);font-weight:400}
.dl-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
  font-family:var(--display);font-size:16px;color:var(--ink)}
.dl-i{color:var(--glow)}
.dl-s{font-size:10.5px;color:var(--ink-faint);font-family:var(--body);
  margin-inline-start:auto}
.dl-g{display:flex;gap:10px;margin-top:15px}
.dl-c{flex:1;min-width:0;padding:14px 12px;border-radius:15px;background:var(--void);
  text-align:center}
.dl-n{font-family:var(--display);font-weight:300;font-size:27px;line-height:1.15;
  color:var(--ink);font-variant-numeric:tabular-nums}
.dl-n small{font-size:11px;color:var(--ink-faint);margin-inline-start:4px;
  font-family:var(--body)}
.dl-n .up{color:#7CC7A6;font-size:15px}
.dl-n .dn{color:#D98C8C;font-size:15px}
.dl-n .fl{color:var(--ink-faint);font-size:15px}
.dl-l{font-size:11px;color:var(--ink-faint);margin-top:6px}
.dl-w{font-size:11px;color:var(--ink-soft);margin-top:5px;font-variant-numeric:tabular-nums;
  opacity:.8}
.dl-row{display:flex;gap:10px;align-items:baseline;margin-top:13px;font-size:12.5px;
  line-height:1.9;color:var(--ink-soft)}
.dl-t{flex:0 0 auto;font-size:10.5px;padding:3px 9px;border-radius:999px}
.dl-t.up{color:#7CC7A6;border:1px solid #7CC7A6}
.dl-t.dn{color:#D98C8C;border:1px solid #D98C8C}
.dl-row b.up{color:#7CC7A6;font-weight:400}
.dl-row b.dn{color:#D98C8C;font-weight:400}
.dl-f{margin-top:14px;padding-top:13px;border-top:1px dashed var(--flat-line);
  font-size:12.5px;line-height:1.95;color:var(--ink-faint)}
.key{background:var(--glow-tint);border:1px solid var(--btn-line);border-radius:13px;
  padding:14px 16px;font-size:15px;line-height:1.85;color:var(--ink);margin:16px 0}
.key b{color:var(--btn-ink);font-weight:600}
.wex{background:var(--flat);border:1px solid var(--flat-line);border-radius:14px;padding:15px 16px;margin-top:14px}
.wex .q{font-size:16px;line-height:1.8;margin-bottom:12px}
.wex .o{display:flex;gap:8px;align-items:center;font-size:14.5px;padding:7px 0;color:var(--ink-soft)}
.wex .o.on{color:var(--grow);font-weight:500}
.wex .o span.m{width:16px;text-align:center;font-size:12px;opacity:.7}
.dotsi{display:flex;gap:6px;justify-content:center;padding:16px 0 4px}
.dotsi i{width:6px;height:6px;border-radius:50%;background:var(--flat-line);display:block}
.dotsi i.on{background:var(--glow)}
.devbtn{position:absolute;top:calc(env(safe-area-inset-top,0) + 8px);left:8px;
  width:34px;height:34px;border-radius:50%;border:1px solid var(--flat-line);
  background:var(--flat);color:var(--ink-faint);font-size:15px;
  cursor:pointer;z-index:40;display:flex;align-items:center;justify-content:center;padding:0}
.devbtn:active{color:var(--ink)}
.devpanel{position:absolute;inset:0;z-index:50;background:var(--void);
  padding:22px;overflow-y:auto;display:none}
.devpanel.on{display:block}
.devpanel h4{font-family:var(--display);font-size:12px;letter-spacing:.14em;
  color:var(--ink-faint);margin:20px 0 10px;font-weight:500}
.devpanel h4:first-child{margin-top:4px}
.devgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.devgrid button{background:var(--flat);border:1px solid var(--flat-line);border-radius:11px;
  padding:13px 8px;font-family:var(--body);font-size:13.5px;color:var(--ink);cursor:pointer}
.devgrid button:active{border-color:var(--glow)}
.devclose{width:100%;margin-top:22px;background:transparent;border:1px solid var(--flat-line);
  border-radius:11px;padding:13px;color:var(--ink-soft);font-family:var(--body);font-size:14px;cursor:pointer}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--flat-line);
  background:var(--flat);color:var(--ink-soft);cursor:pointer;font-size:15px;
  display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.iconbtn:active{color:var(--ink)}
.sheet{position:absolute;inset:0;z-index:45;background:rgba(0,0,0,.5);
  display:flex;align-items:flex-end;animation:fade .2s ease}
.sheet-in{width:100%;background:var(--void);border-top:1px solid var(--glass-line);
  border-radius:24px 24px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom,0));
  box-shadow:0 -18px 40px rgba(0,0,0,.35)}
.sheet-in .grab{width:38px;height:4px;border-radius:4px;background:var(--flat-line);
  margin:0 auto 16px}
.thgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.thcard{background:var(--flat);border:1px solid var(--flat-line);border-radius:14px;
  padding:8px 8px 9px;cursor:pointer;font-family:var(--body);color:var(--ink-soft);font-size:12.5px}
.thcard.sel{border-color:var(--btn-line);color:var(--ink)}
.thsw{height:38px;border-radius:9px;margin-bottom:7px;position:relative;overflow:hidden;
  border:1px solid rgba(128,128,128,.18)}
.thsw i{position:absolute;left:7px;bottom:6px;width:9px;height:9px;border-radius:50%}
.dev{margin-top:26px;padding:14px;border:1px dashed var(--line);border-radius:13px}
.dev h3{font-size:11.5px;color:var(--ink-faint);letter-spacing:.12em;margin-bottom:10px}
.dev .seg button{font-size:12px;padding:9px 3px}

/* شاشات قصيرة (متصفح بشريط عنوان، أو أجهزة صغيرة) */
@media(max-height:720px){
  h1{font-size:22px;line-height:1.45}
  .glass{padding:18px 16px;border-radius:22px}
  .top{padding:16px 0 10px;min-height:50px}
  .center{padding:18px 0}
  .stem{font-size:17px;line-height:1.8;margin:12px 0 20px}
  .choice{padding:14px 16px;margin-bottom:7px}
  .horizon{height:104px}
  .btn{padding:15px}
  .rule{margin:16px 0}
}

/* ───── الحركة: مرة واحدة عند الدخول، ولا شيء بعدها ───── */
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}*{transition:none!important}}
/* الأجهزة التي لا تدعم الضبابية: سطح مصمت بديل */
/* السطح الزجاجي هنا شفافية + حافة ضوء + ظل — بلا ضبابية.
   الخلفية تدرّج أملس، والضبابية عليها بلا أثر مرئي. */

/* ══════════════════ هويّة الأفكار — عالَمٌ ثانٍ ══════════════════
   التدريب: زجاجٌ على ليل. بطاقات عائمة، حوافّ مضيئة، إيقاع سريع.
   الأفكار: ورق.  لا بطاقات — خطوط. طباعة تحريرية. هامش وحبر.
   القاعدة: الورق واحد في كلّ المسارات، والحبر يختلف بالمسار.
   كلّ ما تحت هذا السطر محصور في .lwrap.ideas ولا يمسّ التدريب.
   ═══════════════════════════════════════════════════════════ */

/* ① حبر كلّ مسار — الليل */
[data-track="qudurat"] .lwrap.ideas{ --ink-hue:#8FAAC9 }
[data-track="tahsili"] .lwrap.ideas{ --ink-hue:#8CC4AB }
[data-track="step"]    .lwrap.ideas{ --ink-hue:#BCA6D6 }
[data-track="kfupm"]   .lwrap.ideas{ --ink-hue:#D9B57F }
[data-track="aramco"]  .lwrap.ideas{ --ink-hue:#D69B9B }
/* والنهار */
[data-mode="day"][data-track="qudurat"] .lwrap.ideas{ --ink-hue:#3C5A80 }
[data-mode="day"][data-track="tahsili"] .lwrap.ideas{ --ink-hue:#2F6551 }
[data-mode="day"][data-track="step"]    .lwrap.ideas{ --ink-hue:#5D4885 }
[data-mode="day"][data-track="kfupm"]   .lwrap.ideas{ --ink-hue:#7E5A1E }
[data-mode="day"][data-track="aramco"]  .lwrap.ideas{ --ink-hue:#8B4141 }

/* ② الورق — سطحٌ دافئ يحلّ محلّ الزجاج البارد */
.lwrap.ideas{
  --paper-bg:#13110C;
  --paper-ink:#E8E2D4;
  --paper-soft:#A79E8C;
  --paper-faint:#6E6656;
  --rule:rgba(224,210,180,.155);
  --rule-soft:rgba(224,210,180,.075);
  --ink-hue:var(--idea);
  color:var(--paper-ink);
  font-family:var(--body);
  padding-inline-start:26px;
  animation:pgIn .5s cubic-bezier(.2,.8,.3,1) both;
}
[data-mode="day"] .lwrap.ideas{
  --paper-bg:#F6F1E6;
  --paper-ink:#2A2519;
  --paper-soft:#5E5747;
  --paper-faint:#918977;
  --rule:rgba(94,79,53,.24);
  --rule-soft:rgba(94,79,53,.11);
}
@keyframes pgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* الورقة نفسها: تحلّ محلّ التوهّج الدائري */
.lwrap.ideas::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    repeating-linear-gradient(180deg,transparent 0 25px,var(--rule-soft) 25px 26px),
    radial-gradient(120% 70% at 50% -10%,rgba(224,210,180,.05),transparent 68%),
    var(--paper-bg);
  opacity:1;
}
[data-mode="day"] .lwrap.ideas::before{
  background:
    repeating-linear-gradient(180deg,transparent 0 25px,var(--rule-soft) 25px 26px),
    var(--paper-bg);
}

/* ③ هامش الدفتر — الخطّ الرأسي الذي يقول: أنت في مكان آخر */
.lwrap.ideas::after{
  content:'';position:absolute;inset-block:0;inset-inline-start:9px;width:1px;
  background:linear-gradient(180deg,transparent,var(--rule) 8%,var(--rule) 88%,transparent);
  pointer-events:none;
}

/* ④ الترويسة — عنوان تحريريّ لا شريط تطبيق */
.lwrap.ideas .lbar2{
  padding:6px 0 18px;margin-bottom:20px;
  border-bottom:1px solid var(--rule);
  align-items:flex-end;
}
.lwrap.ideas .lb-l .lg{color:var(--ink-hue)}
.lwrap.ideas .lb-n{
  font-family:var(--display);font-size:19px;line-height:1.45;
  color:var(--paper-ink);letter-spacing:-.01em;
}
.lwrap.ideas .lb-w{
  font-size:10px;letter-spacing:.24em;max-width:none;
  color:var(--ink-hue);opacity:.9;
}

/* ⑤ الخيط — تقدّمٌ كأقسام كتاب لا كشمسٍ تطلع */
.lwrap.ideas .rail{display:flex;gap:5px;align-items:center}
.lwrap.ideas .rl{width:auto;height:18px;padding:0 1px}
.lwrap.ideas .rl i{
  width:15px;height:2px;border-radius:0;
  background:var(--rule);transition:background .3s,width .3s;
}
.lwrap.ideas .rl.past i{background:var(--ink-hue);opacity:.5}
.lwrap.ideas .rl.on i{background:var(--ink-hue);width:24px;opacity:1}

/* ⑥ الطباعة — قياسٌ للقراءة لا للحلّ */
.lwrap.ideas .sc{max-width:23em;margin-inline:auto}
.lwrap.ideas .sc-q,
.lwrap.ideas .sc-h{
  font-family:var(--display);font-size:12.5px;letter-spacing:.2em;
  color:var(--ink-hue);opacity:.85;margin-bottom:18px;
}
.lwrap.ideas .sk-t,.lwrap.ideas .stt,.lwrap.ideas .so-t{
  font-family:var(--display);font-size:22px;line-height:1.75;color:var(--paper-ink);
}
.lwrap.ideas .sk-q,.lwrap.ideas .twt,.lwrap.ideas .ft,
.lwrap.ideas .stp,.lwrap.ideas .note,.lwrap.ideas .so-w{
  font-size:16.5px;line-height:2.15;color:var(--paper-ink);
}
.lwrap.ideas .meta,.lwrap.ideas .lb-tx .lb-w,
.lwrap.ideas .fl,.lwrap.ideas .eyebrow,.lwrap.ideas .so-e{
  color:var(--paper-soft);
}
.lwrap.ideas b,.lwrap.ideas strong{color:var(--ink-hue);font-weight:600}

/* ⑦ لا بطاقات — خطٌّ فاصل بدل الصندوق */
.lwrap.ideas .sc-key,
.lwrap.ideas .sg,
.lwrap.ideas .fc,
.lwrap.ideas .tw,
.lwrap.ideas .icard,
.lwrap.ideas .wex,
.lwrap.ideas .stair{
  background:none !important;
  border:0 !important;
  border-radius:0 !important;
  box-shadow:none !important;
  backdrop-filter:none !important;
  padding:0 0 0 0;
}
.lwrap.ideas .sc-key{padding:6px 0 22px;text-align:start;border-bottom:1px solid var(--rule) !important}
.lwrap.ideas .sg,
.lwrap.ideas .fc,
.lwrap.ideas .tw{
  padding:4px 0 20px;margin-bottom:20px;
  border-bottom:1px solid var(--rule-soft) !important;
}
.lwrap.ideas .sig{gap:0}
.lwrap.ideas .face{margin-top:22px}
.lwrap.ideas .fc{border-inline-start:0 !important;padding-inline-start:16px;position:relative}
.lwrap.ideas .fc::before{
  content:'';position:absolute;inset-block:2px 22px;inset-inline-start:0;width:2px;
  background:var(--rule);
}
.lwrap.ideas .fc.good::before{background:var(--ink-hue)}
.lwrap.ideas .fvs{
  font-family:var(--display);font-size:10.5px;letter-spacing:.3em;
  color:var(--paper-faint);text-align:center;margin:2px 0 18px;
}
.lwrap.ideas .twi{
  background:none;border:1px solid var(--ink-hue);color:var(--ink-hue);
  border-radius:0;font-family:var(--display);
}

/* ⑧ حرفٌ استهلاليّ — توقيع الورق */
.lwrap.ideas .sc-open .so-w::first-letter,
.lwrap.ideas .sc-key .sk-q::first-letter{
  font-family:var(--display);font-size:2.3em;line-height:.9;
  color:var(--ink-hue);float:inline-start;
  margin-inline-end:.12em;margin-block-start:.06em;
}

/* ⑨ الخريطة والخطوات — بحبر المسار */
.lwrap.ideas .lmap .track{background:var(--rule-soft);border-radius:0;height:2px}
.lwrap.ideas .lmap .track i{background:var(--ink-hue);border-radius:0}
.lwrap.ideas .lmap .nm{color:var(--paper-ink)}
.lwrap.ideas .lmap .pc{color:var(--ink-hue);font-variant-numeric:tabular-nums}
.lwrap.ideas .steps.num li{color:var(--paper-ink);line-height:2.3}
.lwrap.ideas .steps.num li::before{color:var(--ink-hue);font-family:var(--display)}

/* ⑩ المثال — خياراتٌ كسطور لا كأزرار */
.lwrap.ideas .wex .q{
  font-size:17px;line-height:2.05;color:var(--paper-ink);
  padding-bottom:16px;border-bottom:1px solid var(--rule);margin-bottom:14px;
}
.lwrap.ideas .wex .o{
  background:none !important;border:0 !important;border-radius:0 !important;
  padding:11px 0;color:var(--paper-soft);
  border-bottom:1px solid var(--rule-soft) !important;
}
.lwrap.ideas .wex .o.on{color:var(--paper-ink)}
.lwrap.ideas .wex .o .m{color:var(--ink-hue);background:none;border:0}

/* ⑪ الأزرار — حبر على ورق */
.lwrap.ideas .btn{
  font-family:var(--display);border-radius:0;
  background:var(--ink-hue);color:var(--paper-bg);border:0;
  letter-spacing:.02em;
}
.lwrap.ideas .btn.ghost{
  background:none;color:var(--ink-hue);
  border:0;border-bottom:1px solid var(--ink-hue);
  border-radius:0;padding-inline:2px;
}
.lwrap.ideas .rule{background:var(--rule);height:1px}


/* ══════ يتنفّس مع اليوم ══════ */
.brcard{padding:16px 15px;border-radius:18px;cursor:pointer;
  background:var(--flat);border:1px solid var(--flat-line);transition:border-color .25s,background .25s}
.brcard.sel{border-color:var(--glow);background:var(--glow-tint)}
.brh{display:flex;align-items:center;gap:9px;font-family:var(--display);font-size:15px;color:var(--ink)}
.brdot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;
  background:linear-gradient(135deg,#0E1017 0 50%,#F4F2EC 50% 100%);
  box-shadow:0 0 0 3px var(--glow-tint);animation:brSpin 9s linear infinite}
@keyframes brSpin{to{transform:rotate(360deg)}}
.brs{margin-top:7px;font-size:12px;line-height:1.9;color:var(--ink-soft)}
.brs b{color:var(--glow);font-weight:600}
.brask{position:fixed;inset-inline:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:90;
  padding:15px 16px;border-radius:18px;background:var(--solid);
  border:1px solid var(--glass-line);box-shadow:0 16px 40px rgba(0,0,0,.34);
  animation:brUp .45s cubic-bezier(.2,.8,.3,1) both}
@keyframes brUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.brtx{font-size:13.5px;line-height:1.95;color:var(--ink)}
.brtx span{color:var(--ink-soft);font-size:12.5px}
.brbt{display:flex;gap:9px;margin-top:13px}
.brbt button{flex:1;padding:10px 0;border-radius:12px;font-family:var(--display);font-size:13px;
  cursor:pointer;background:transparent;border:1px solid var(--line);color:var(--ink-soft)}
.brbt button[data-br="keep"]{background:var(--btn-bg);border-color:var(--btn-line);color:var(--btn-ink)}

/* ══════ صباح الأمس · المبارزة · التوقّف اللطيف ══════ */
.notec{margin-top:14px;padding:16px 17px;border-radius:18px;
  background:var(--flat);border:1px dashed var(--flat-line);text-align:start}
.notec.done{border-style:solid;border-color:var(--glow-tint)}
.notefield{width:100%;padding:13px 14px;border-radius:13px;font-family:var(--body);font-size:16px;
  background:var(--void);border:1px solid var(--line);color:var(--ink);outline:none}
.notefield:focus{border-color:var(--glow)}
.notetx{margin-top:8px;font-size:15px;line-height:1.95;color:var(--ink)}
.noteback{margin-top:14px;padding:15px 17px;border-radius:18px;cursor:pointer;text-align:start;
  background:var(--glow-tint);border:1px solid var(--glass-line);
  animation:nbIn .55s cubic-bezier(.2,.8,.3,1) both}
@keyframes nbIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.nbh{font-size:11px;letter-spacing:.2em;color:var(--glow);font-family:var(--display)}
.nbt{margin-top:9px;font-size:16px;line-height:2;color:var(--ink)}
.nbx{display:block;margin-top:11px;font-size:11.5px;color:var(--ink-faint)}

.duelpre{margin-top:14px;padding:12px 14px;border-radius:14px;text-align:start;
  background:var(--glow-tint);border-inline-start:2px solid var(--glow);
  font-size:14px;line-height:1.9;color:var(--ink)}
.duelpre .dmark{color:var(--glow);margin-inline-end:8px}
.duelpre span:not(.dmark){display:block;color:var(--ink-soft);font-size:12.5px;margin-top:3px}

.duelwin{position:relative;margin-top:16px;padding:26px 18px 22px;border-radius:20px;overflow:hidden;
  background:var(--glow-tint);border:1px solid var(--glow);text-align:center}
.dwrays{position:absolute;inset:-40%;pointer-events:none;
  background:conic-gradient(from 0deg,transparent 0 6deg,var(--glow) 6deg 7deg,transparent 7deg 30deg);
  opacity:.16;animation:dwSpin 22s linear infinite}
@keyframes dwSpin{to{transform:rotate(360deg)}}
.dwt{position:relative;font-family:var(--display);font-size:26px;color:var(--glow);letter-spacing:-.01em;
  animation:dwPop .7s cubic-bezier(.2,1.3,.4,1) both}
@keyframes dwPop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
.dwb{position:relative;margin-top:8px;font-size:13.5px;line-height:1.9;color:var(--ink-soft)}

.stopc{margin:14px 0 4px;padding:16px 17px;border-radius:18px;text-align:start;
  background:var(--flat);border:1px solid var(--flat-line);
  animation:nbIn .5s cubic-bezier(.2,.8,.3,1) both}
.sch{font-family:var(--display);font-size:16px;color:var(--ink)}
.scb{margin-top:8px;font-size:13px;line-height:2;color:var(--ink-soft)}
.scbt{display:flex;gap:9px;margin-top:14px}
.scbt button{flex:1;padding:11px 0;border-radius:13px;font-family:var(--display);font-size:13.5px;
  cursor:pointer;background:transparent;border:1px solid var(--line);color:var(--ink-soft)}
.scbt button.pri{background:var(--btn-bg);border-color:var(--btn-line);color:var(--btn-ink)}

/* ══════ وضع الأقسام ══════ */
.exbar{position:fixed;inset-inline:0;top:0;height:3px;background:var(--line);z-index:60}
.exbar i{display:block;height:100%;background:var(--glow);transition:width .5s linear}
.extop{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 6px}
.exsec{font-family:var(--display);font-size:12px;letter-spacing:.16em;color:var(--ink-soft)}
.exclock{font-family:var(--display);font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums;
  transition:color .4s}
.exclock.low{color:#D98A6A}
.exdots{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 16px}
.exd{width:13px;height:5px;border-radius:3px;border:0;padding:0;cursor:pointer;
  background:var(--line);transition:background .2s,transform .2s}
.exd.ans{background:var(--glow);opacity:.55}
.exd.now{background:var(--ink);transform:scaleY(1.9)}
.exstem{font-size:17px;line-height:2.05;color:var(--ink);margin:12px 0 16px}
.exq{padding-bottom:12px}
.exnav{display:flex;gap:10px;margin-top:6px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
.exnav button{flex:1;padding:14px 0;border-radius:14px;font-family:var(--display);font-size:14px;
  cursor:pointer;background:transparent;border:1px solid var(--line);color:var(--ink-soft)}
.exnav button.pri{background:var(--btn-bg);border-color:var(--btn-line);color:var(--btn-ink)}
.exnav button[disabled]{opacity:.35}
.exrow{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13px;color:var(--ink-soft)}
.exrow .num{font-variant-numeric:tabular-nums;color:var(--ink)}
.exmini{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.exmini i{display:block;height:100%;background:var(--glow)}
.exinv{margin:6px 0 12px;padding:16px 17px;border-radius:18px;cursor:pointer;text-align:start;
  background:var(--flat);border:1px solid var(--flat-line);transition:border-color .25s}
.exinv:active{border-color:var(--glow)}
.exih{font-family:var(--display);font-size:15px;color:var(--ink)}
.exib{margin-top:7px;font-size:12.5px;line-height:1.95;color:var(--ink-soft)}
.exia{display:block;margin-top:10px;font-size:12.5px;color:var(--glow);font-family:var(--display)}

/* ══════ تلميح التثبيت على آيفون ══════ */
.ioshint{margin-top:14px;padding:15px 17px;border-radius:18px;cursor:pointer;text-align:start;
  background:var(--flat);border:1px solid var(--flat-line)}
.ioh{font-family:var(--display);font-size:14.5px;color:var(--ink)}
.iob{margin-top:7px;font-size:12.5px;line-height:1.95;color:var(--ink-soft)}
.ioa{display:block;margin-top:9px;font-size:11.5px;color:var(--ink-faint)}

/* ══════ الصفّ الدراسي ══════ */
.gradec{margin-top:14px;padding:16px 17px;border-radius:18px;text-align:start;
  background:var(--flat);border:1px solid var(--flat-line)}
.grh{font-family:var(--display);font-size:15px;color:var(--ink)}
.grb{margin-top:6px;font-size:12.5px;line-height:1.9;color:var(--ink-soft)}
.grbt{display:flex;gap:8px;margin-top:13px}
.grbt button{flex:1;padding:11px 4px;border-radius:12px;font-family:var(--display);font-size:12.5px;
  cursor:pointer;background:transparent;border:1px solid var(--line);color:var(--ink-soft)}
.grbt button:active{border-color:var(--glow);color:var(--ink)}

/* ══════ التثبيت ══════ */
.inst{padding:15px 16px;border-radius:16px;background:var(--void);border:1px solid var(--line)}
.insh{display:flex;align-items:center;gap:9px;font-family:var(--display);font-size:14.5px;color:var(--ink)}
.insd{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--ink-faint)}
.inst.on .insd{background:#6FBF95;box-shadow:0 0 0 4px rgba(111,191,149,.16)}
.inst.can .insd{background:var(--glow);box-shadow:0 0 0 4px var(--glow-tint);animation:pulseD 2.4s ease-in-out infinite}
.inst.ios .insd{background:var(--glow);opacity:.7}
@keyframes pulseD{0%,100%{box-shadow:0 0 0 4px var(--glow-tint)}50%{box-shadow:0 0 0 8px transparent}}
.insb{margin-top:8px;font-size:12.5px;line-height:1.95;color:var(--ink-soft)}
.instinv{margin-top:14px;padding:16px 17px;border-radius:18px;text-align:start;
  background:var(--glow-tint);border:1px solid var(--glass-line)}
.iih{font-family:var(--display);font-size:15px;color:var(--ink)}
.iib{margin-top:7px;font-size:12.5px;line-height:1.9;color:var(--ink-soft)}
.iibt{display:flex;gap:9px;margin-top:13px}
.iibt button{flex:1;padding:11px 0;border-radius:12px;font-family:var(--display);font-size:13px;
  cursor:pointer;background:transparent;border:1px solid var(--line);color:var(--ink-soft)}
.iibt button.pri{background:var(--btn-bg);border-color:var(--btn-line);color:var(--btn-ink)}
/* ══════ اختيار نوع الاختبار ══════ */
.exinv.locked{opacity:.72}
.exia.dim{color:var(--ink-faint)}
.exsel{display:flex;gap:9px;margin-top:13px}
.exsel button{flex:1;padding:12px 8px;border-radius:13px;cursor:pointer;text-align:center;
  background:transparent;border:1px solid var(--line)}
.exsel button b{display:block;font-family:var(--display);font-size:13.5px;color:var(--ink);font-weight:500}
.exsel button span{display:block;margin-top:4px;font-size:11px;color:var(--ink-faint)}
.exsel button:active{border-color:var(--glow)}

/* ══════ مقياس الإتقان ══════ */
.mtop{display:flex;align-items:center;gap:16px;padding:16px 18px}
.mring{position:relative;flex:0 0 auto;width:76px;height:76px}
.ring{display:block}
.mrv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:21px;color:var(--ink)}
.mrv em{font-style:normal;font-size:12px;color:var(--ink-faint);margin-inline-start:1px}
.mtx{flex:1;min-width:0}
.mtw{font-family:var(--display);font-size:17px;color:var(--glow);margin:4px 0 5px}
.mrow{display:flex;align-items:center;gap:9px}
.mnm{flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42%}
.mbar{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden;min-width:40px}
.mbar i{display:block;height:100%;background:var(--glow);border-radius:3px;
  transition:width .8s cubic-bezier(.2,.8,.3,1)}
.mpc{flex:0 0 auto;font-size:11.5px;color:var(--ink-soft);min-width:34px;text-align:end}

/* ══════ جولات اليوم ══════ */
.rnds{margin-top:14px;padding:15px 17px;border-radius:18px;text-align:start;
  background:var(--flat);border:1px solid var(--flat-line)}
.rnh{display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--display);font-size:14px;color:var(--ink);margin-bottom:11px}
.rnn{font-size:12px;color:var(--ink-soft)}
.rnr{display:flex;align-items:center;gap:11px;padding:9px 0;border-top:1px solid var(--rule,var(--line))}
.rnr:first-of-type{border-top:0}
.rnd{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--line)}
.rnr.done .rnd{background:var(--glow)}
.rnr.now .rnd{background:var(--glow);box-shadow:0 0 0 4px var(--glow-tint);animation:pulseD 2.2s ease-in-out infinite}
.rnr.late .rnd{background:#D98A6A}
.rnt{flex:1;min-width:0;font-size:13.5px;color:var(--ink)}
.rnr.done .rnt{color:var(--ink-soft)}
.rnt em{display:block;font-style:normal;font-size:11px;color:var(--ink-faint);margin-top:3px}
.rns{flex:0 0 auto;font-size:11.5px;color:var(--glow);font-family:var(--display)}
.rnr.late .rns{color:#D98A6A}
.rnl{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);
  font-size:12.5px;line-height:1.9;color:var(--ink-soft)}
.rnl.dim{color:var(--ink-faint)}
.tin{background:var(--void);border:1px solid var(--line);color:var(--ink);
  border-radius:10px;padding:7px 10px;font-size:16px;font-family:var(--body);outline:none}
.tin:focus{border-color:var(--glow)}

.mlock{display:flex;align-items:center;gap:16px;padding:16px 18px}
.mlk{position:relative;flex:0 0 auto;width:62px;height:62px;opacity:.55}
.mli{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:18px;color:var(--ink-faint)}

/* ══════ رجوع صريح ══════ */
.backtop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.backb{display:inline-flex;align-items:center;gap:6px;background:none;border:0;cursor:pointer;
  padding:6px 2px;color:var(--ink-soft);font-family:var(--display);font-size:13px}
.backb svg{transform:scaleX(-1)}
.backb:active{color:var(--glow)}
/* ══════ عن أُفق ══════ */
.abt{text-align:center;padding:24px 8px 10px}
.abmark{color:var(--glow);opacity:.9}
.abn{font-family:var(--display);font-size:30px;margin:12px 0 6px;color:var(--ink)}
.abv{font-size:12px;color:var(--ink-faint);letter-spacing:.04em}
.abd{margin-top:16px;font-size:14px;line-height:2.05;color:var(--ink-soft);text-align:start}
.abd b{color:var(--glow);font-weight:600}
.credit{margin:26px 0 8px;padding-top:18px;border-top:1px solid var(--line);text-align:center}
.crm{font-family:var(--display);font-size:13.5px;color:var(--ink-soft)}
.crs{margin-top:6px;font-size:11px;line-height:1.8;color:var(--ink-faint)}

.inst.man .insd{background:var(--glow);opacity:.85}
.dgw{padding:13px 14px;border-radius:14px;background:var(--void);border:1px solid var(--line)}
.dgr{display:flex;align-items:center;gap:9px;padding:8px 0;font-size:12.5px}
.dgr+.dgr{border-top:1px solid var(--line)}
.dgd{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.dgd.ok{background:#6FBF95}
.dgd.bad{background:#D98A6A}
.dgt{flex:1;color:var(--ink-soft)}
.dgv{flex:0 0 auto;color:var(--ink);font-size:11.5px;max-width:54%;text-align:end;line-height:1.6}

.exinv.due{background:var(--glow-tint);border-color:var(--glow)}
.exinv.due .exih{color:var(--glow)}

/* ══════ جرّب — المحاولة قبل الشرح ══════ */
.sc-try .wex .o.try{width:100%;text-align:start;cursor:pointer;
  background:none;border:0;border-bottom:1px solid var(--rule-soft);
  padding:13px 0;color:var(--paper-ink);font-family:var(--body);font-size:16px;
  transition:color .2s,opacity .3s}
.sc-try .wex .o.try:active{color:var(--ink-hue)}
.sc-try .wex .o.try .m{color:var(--paper-faint);margin-inline-end:10px}
.sc-try .wex .o.right{color:var(--ink-hue)}
.sc-try .wex .o.right .m{color:var(--ink-hue)}
.sc-try .wex .o.wrong{color:#C98A6A}
.sc-try .wex .o.wrong .m{color:#C98A6A}
.sc-try .wex .o.dim{opacity:.42}
.tryres{margin-top:16px;padding:14px 15px;border-radius:0;
  border-inline-start:2px solid var(--rule);
  font-size:14.5px;line-height:2.05;color:var(--paper-soft)}
.tryres b{color:var(--paper-ink);font-weight:600}
.tryres em{font-style:normal;color:var(--ink-hue)}
.tryres.ok{border-inline-start-color:var(--ink-hue)}
.tryres.no{border-inline-start-color:#C98A6A}
.sc-key.locked{opacity:.85}
.sc-key.locked .sk-q{color:var(--paper-faint)}

/* ══════ الأفكار: شاشة واحدة · مسار واحد ══════ */
.lwrap.ideas{display:flex;flex-direction:column;min-height:0;flex:1}
.lwrap.ideas .lscene{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.lwrap.ideas .sc{max-width:23em;margin-inline:auto;width:100%}
.sc-h .scn{font-style:normal;font-size:10.5px;color:var(--paper-faint);margin-inline-start:8px;
  font-variant-numeric:tabular-nums}
.lwrap.ideas .rail .rl{display:inline-block;width:auto;height:18px;padding:0 1px;pointer-events:none}
.lwrap.ideas .lfoot{flex:0 0 auto;padding-top:14px}
.lwrap.ideas .skipl{display:block;width:100%;margin-top:9px;background:none;border:0;
  color:var(--paper-faint);font-size:12.5px;font-family:var(--body);cursor:pointer}
/* تصغير محسوب ليدخل المشهد في شاشة واحدة */
.lwrap.ideas .sk-t,.lwrap.ideas .stt,.lwrap.ideas .so-t{font-size:20px;line-height:1.7}
.lwrap.ideas .sk-q,.lwrap.ideas .twt,.lwrap.ideas .ft,
.lwrap.ideas .stp,.lwrap.ideas .note,.lwrap.ideas .so-w{font-size:15.5px;line-height:2}
.lwrap.ideas .steps.num li{line-height:2}

/* ══════ أشكال التطوّر ══════ */
.vhead{margin-bottom:6px}
.vstage{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:230px;animation:vIn .55s cubic-bezier(.2,.8,.3,1) both}
@keyframes vIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.vsvg{display:block;width:100%;max-width:320px;height:auto}
.vfoot{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  width:100%;max-width:320px;margin-top:12px;font-size:11.5px;line-height:1.8;color:var(--ink-faint)}
.vfoot .vpc{font-size:22px;color:var(--glow)}
.vswitch{display:flex;gap:6px;margin-top:14px}
.vsw{flex:1;padding:9px 4px;border-radius:12px;cursor:pointer;font-family:var(--display);font-size:12px;
  background:transparent;border:1px solid var(--line);color:var(--ink-faint);transition:.22s}
.vsw.on{background:var(--glow-tint);border-color:var(--glow);color:var(--glow)}
.vrg{transform-origin:center;opacity:0;animation:vrgIn .5s cubic-bezier(.2,.8,.3,1) forwards;
  animation-delay:calc(var(--i)*65ms)}
@keyframes vrgIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
.vsun{animation:vUp 1s cubic-bezier(.2,.8,.3,1) both}
@keyframes vUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.vland{stroke-dasharray:400;stroke-dashoffset:400;animation:vDr 1s .2s ease-out forwards}
@keyframes vDr{to{stroke-dashoffset:0}}
.vmk{opacity:0;animation:vFade .35s forwards;animation-delay:calc(560ms + var(--i)*42ms)}
@keyframes vFade{to{opacity:1}}
.vtl{stroke-dasharray:44;stroke-dashoffset:44;animation:vDr2 .45s ease-out forwards;
  animation-delay:calc(var(--i)*52ms)}
@keyframes vDr2{to{stroke-dashoffset:0}}
.vempty{text-align:center;padding:34px 10px;color:var(--ink-faint)}
.vempty .vsp{display:block;font-size:22px;color:var(--glow);opacity:.6;margin-bottom:10px}
.vempty p{font-size:13px;line-height:1.9;margin:0}
.vwit{width:100%;max-width:320px;text-align:start}
.wrow{border-inline-start:2px solid var(--line);padding-inline-start:13px;margin-bottom:16px}
.wrow.bad{border-inline-start-color:#C98A6A}
.wrow.good{border-inline-start-color:var(--glow)}
.wd{font-size:10.5px;letter-spacing:.16em;color:var(--ink-faint)}
.wq{font-size:15.5px;line-height:1.85;color:var(--ink);margin-top:5px}
.wn{font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.8}
.wpunch{margin:18px 0 0;font-size:15px;line-height:1.9;color:var(--glow)}

/* ══════ بُعد الانتقال بين التبويبات ══════ */
:root{--wx:50%;--wy:-8%;--hue:var(--glow)}
#shell::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(120% 62% at var(--wx) var(--wy),
    color-mix(in srgb, var(--hue) 13%, transparent), transparent 68%);
  transition:background .75s cubic-bezier(.2,.8,.3,1)}
#app,#tabs,#brandbar{position:relative;z-index:1}
@supports not (color: color-mix(in srgb, red 10%, blue)){
  #shell::after{background:radial-gradient(120% 62% at var(--wx) var(--wy),var(--glow-tint),transparent 68%)}
}
/* شريط رفيع بلون التبويب أعلى المحتوى — علامة المكان */
.stabs{position:relative}
.stabs::after{content:'';position:absolute;inset-inline:0;bottom:-7px;height:1px;
  background:linear-gradient(90deg,transparent,var(--hue),transparent);opacity:.45;
  transition:opacity .5s}
.stb.on{border-color:var(--hue);color:var(--hue);background:transparent}
/* انزلاق باتّجاه الحركة */
[data-slide="f"] #app > *{animation:slF .42s cubic-bezier(.2,.8,.3,1) both}
[data-slide="b"] #app > *{animation:slB .42s cubic-bezier(.2,.8,.3,1) both}
@keyframes slF{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes slB{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
  [data-slide] #app > *{animation:none}
  #shell::after{transition:none}
}

/* شبكة السمات صفٌّ يُسحب أفقيًّا — بدل عمودٍ يطول */
.thgrid{display:flex;gap:9px;overflow-x:auto;padding-bottom:6px;
  scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.thgrid::-webkit-scrollbar{display:none}
.thgrid .thcard{flex:0 0 42%;scroll-snap-align:start}
.thgrid::after{content:'';flex:0 0 2px}

/* ══════ التبويبات في صفّين — بلا انزلاق أفقيّ ══════ */
.stabs{display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start}
.stb{flex:1 1 22%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding:9px 4px;font-size:12px}
/* شبكة السمات تعود شبكةً لا صفًّا منزلقًا */
.thgrid{display:grid !important;grid-template-columns:repeat(3,1fr);gap:8px;
  overflow:visible !important;scroll-snap-type:none}
.thgrid .thcard{flex:none;padding:7px 6px 8px;font-size:11.5px}
.thgrid::after{display:none}
/* شريط تبويبات أشكال التطوّر أيضًا في صفّ واحد بلا انزلاق */
.vswitch{flex-wrap:wrap}
.vsw{flex:1 1 22%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ══════ الخيط: الوصلات والهمسة والتسليمة ══════ */
.thenw{display:block;width:100%;margin-top:10px;padding:11px 4px;background:none;border:0;
  color:var(--ink-faint);font-family:var(--body);font-size:12.5px;cursor:pointer;text-align:start;
  transition:color .25s}
.thenw:active{color:var(--glow)}
.hoff{margin-top:18px;padding:16px 17px;border-radius:18px;text-align:start;
  background:var(--glow-tint);border:1px solid var(--glass-line);
  animation:hoIn .5s cubic-bezier(.2,.8,.3,1) both}
@keyframes hoIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hwhy{margin:10px 0 0;font-size:12.5px;line-height:1.95;color:var(--ink-soft)}
.klink{display:flex;align-items:center;gap:10px;width:100%;margin-top:14px;
  padding:13px 15px;border-radius:15px;cursor:pointer;text-align:start;
  background:var(--flat);border:1px solid var(--flat-line);
  color:var(--ink);font-family:var(--body);font-size:14px;transition:border-color .25s}
.klink:active{border-color:var(--glow)}
.klink.go{background:var(--glow-tint);border-color:var(--glass-line)}
.kl-i{flex:0 0 auto;color:var(--glow);font-size:13px}
.kl-t{flex:1;min-width:0}
.kl-a{flex:0 0 auto;color:var(--ink-faint)}
.eg-k{background:none;border:0;color:var(--glow);font-family:var(--body);font-size:11.5px;
  cursor:pointer;padding:2px 6px;margin-inline-start:auto}
.srow.tap{width:100%;background:none;border:0;cursor:pointer;font-family:inherit;text-align:start}
.srow.tap:active .mnm{color:var(--glow)}
</style>
</head>
<body>
<div id="shell" data-theme="night">
  <div id="app"></div>
  <div id="tabs"></div>
</div>


<script>
/* ══════ تحميل البيانات قبل التطبيق ══════ */
(function () {
  var app = document.getElementById('app');
  function fail(msg) {
    if (app) app.innerHTML = '<div style="padding:60px 24px;text-align:center;color:#9A9585;' +
      'font-family:system-ui;line-height:2">' +
      '<div style="color:#E0D2B4;font-size:22px;margin-bottom:12px">تعذّر تحميل المحتوى</div>' +
      '<div style="font-size:14px">' + msg + '</div>' +
      '<div style="font-size:12px;margin-top:16px;color:#67635A">تأكّد من الاتصال ثمّ أعد الفتح.' +
      ' وبعد أول فتح ناجح يعمل التطبيق بلا إنترنت.</div></div>';
  }
  Promise.all([
    fetch('./bank.json').then(function (r) { if (!r.ok) throw 0; return r.json(); }),
    fetch('./keys.json').then(function (r) { if (!r.ok) throw 0; return r.json(); })
  ]).then(function (a) {
    window.__BANK = a[0]; window.__KEYS = a[1];
    var sc = document.createElement('script');
    sc.src = './app.js';
    sc.onerror = function () { fail('تعذّر تحميل ملفّ التطبيق.'); };
    sc.onload = function () {
      if (window.__SIM) {
        var sm = document.createElement('script'); sm.src = './sim.js';
        document.body.appendChild(sm);
      }
    };
    document.body.appendChild(sc);
  }).catch(function () {
    fail('تعذّر تحميل بنك الأسئلة.');
  });
})();
</script>

</body>
</html>
